entities:
  project:
    columns:
      - title: ID
        content: .id
      - title: Name
        content: .name
      - title: Status
        content: .status
    primary: Id
  cluster:
    columns:
      - title: ID
        content: .id
      - title: Name
        content: .name
      - title: Version
        content: .version
      - title: Control Plane
        content: .control_planes
      - title: Status
        content: .statuses.status
    primary: Id
api:
  ListAllClusters:
    entity: cluster
    content: Clusters
    group: Clusters
  ListClustersByProjectID:
    entity: cluster
    content: Clusters
    group: Clusters
  GetProjectNets:
    entity: net
    group: Projects
  GetProjectQuotas:
    entity: quota
    group: Projects
  GetQuotas:
    entity: quota
    group: Quotas
  GetProjectPublicIps:
    entity: publicip
    group: Projects
  GetProjectSnapshots:
    entity: publicip
    group: Projects
  GetKubeconfig:
    content: Cluster.Data.Kubeconfig
    entity: kubeconfig
    group: Clusters
aliases:
- entity: project
  use: clusters id_or_name
  alias_to: ListClustersByProjectID
  alias_help: ListClustersByProjectID
  command:
  - api
  - ListClustersByProjectID
  - --ProjectId
  - '%0'
  - --output
  - table
  flags:
  - name: name
    alias_to: Name
  - name: status
    alias_to: Status
  - name: version
    alias_to: Version
  - name: deleted
    alias_to: Deleted
  - name: cursor
    alias_to: Cursor
  - name: page
    alias_to: Page
  - name: limit
    alias_to: Limit
- entity: project
  use: create
  alias_to: CreateProject
  aliases:
  - add
  alias_help: CreateProject
  command:
  - api
  - GetProjectTemplate
  - --jq
  - '.Template'
  - --single
  - '|'
  - api
  - CreateProject
  - --output
  - yaml
  - --single
  flags:
  - name: cidr
    alias_to: Cidr
    required: false
  - name: description
    alias_to: Description
  - name: disable-api-termination
    alias_to: DisableApiTermination
  - name: name
    alias_to: Name
    required: true
  - name: quirk
    alias_to: Quirks
  - name: region
    alias_to: Region
    required: false
- entity: project
  use: nets id_or_name
  aliases:
    - net
  alias_help: GetProjectNets id_or_name
  alias_to: GetProjectNets
  command:
  - api
  - GetProjectNets
  - '%0'
  - --output
  - yaml
- entity: project
  use: quotas id_or_name
  alias_to: GetProjectQuotas
  alias_help: GetProjectQuotas id_or_name
  command:
  - api
  - GetProjectQuotas
  - '%0'
  - --output
  - yaml
- entity: project
  use: public-ips id_or_name
  aliases:
    - ip
  alias_help: GetProjectPublicIps id_or_name
  alias_to: GetProjectPublicIps
  command:
  - api
  - GetProjectPublicIps
  - '%0'
  - --output
  - yaml
- entity: project
  use: snapshots id_or_name
  aliases:
    - snap
    - snapshot
  alias_help: GetProjectSnapshots id_or_name
  alias_to: GetProjectSnapshots
  command:
  - api
  - GetProjectSnapshots
  - '%0'
  - --output
  - yaml
- entity: cluster
  use: create
  alias_to: CreateCluster
  aliases:
  - add
  alias_help: CreateCluster
  command:
  - api
  - GetClusterTemplate
  - --jq
  - '.Template'
  - --single
  - '|'
  - api
  - CreateCluster
  - --output
  - yaml
  - --single
  flags:
  - name: allow-from
    alias_to: AdminWhitelist
  - name: disable-admission-plugins
    alias_to: AdmissionFlags.DisableAdmissionPlugins
  - name: enable-admission-plugins
    alias_to: AdmissionFlags.EnableAdmissionPlugins
  - name: oidc-client-id
    alias_to: Auth.Oidc.ClientId
  - name: oidc-group-claim
    alias_to: Auth.Oidc.GroupsClaim
  - name: oidc-group-prefix
    alias_to: Auth.Oidc.GroupsPrefix
  - name: oidc-issuer-url
    alias_to: Auth.Oidc.IssuerUrl
  - name: oidc-username-claim
    alias_to: Auth.Oidc.UsernameClaim
  - name: oidc-username-prefix
    alias_to: Auth.Oidc.UsernamePrefix
  - name: upgrade-minor-duration-hour
    alias_to: AutoMaintenances.MinorUpgradeMaintenance.DurationHours
  - name: upgrade-minor-enabled
    alias_to: AutoMaintenances.MinorUpgradeMaintenance.Enabled
  - name: upgrade-minor-start-hour
    alias_to: AutoMaintenances.MinorUpgradeMaintenance.StartHour
  - name: upgrade-minor-tz
    alias_to: AutoMaintenances.MinorUpgradeMaintenance.Tz
  - name: upgrade-minor-week-day
    alias_to: AutoMaintenances.MinorUpgradeMaintenance.WeekDay
  - name: upgrade-patch-duration-hour
    alias_to: AutoMaintenances.PatchUpgradeMaintenance.DurationHours
  - name: upgrade-patch-enabled
    alias_to: AutoMaintenances.PatchUpgradeMaintenance.Enabled
  - name: upgrade-patch-start-hour
    alias_to: AutoMaintenances.PatchUpgradeMaintenance.StartHour
  - name: upgrade-patch-tz
    alias_to: AutoMaintenances.PatchUpgradeMaintenance.Tz
  - name: upgrade-patch-week-day
    alias_to: AutoMaintenances.PatchUpgradeMaintenance.WeekDay
  - name: cidr-pods
    alias_to: CidrPods
    required: false
  - name: cidr-services
    alias_to: CidrService
    required: false
  - name: control-plane
    alias_to: ControlPlanes
  - name: multi-az
    alias_to: CpMultiAz
  - name: subregions
    alias_to: CpSubregions
  - name: description
    alias_to: Description
  - name: disable-api-termination
    alias_to: DisableApiTermination
  - name: maintenance-duration-hour
    alias_to: MaintenanceWindow.DurationHours
  - name: maintenance-start-hour
    alias_to: MaintenanceWindow.StartHour
  - name: maintenance-tz
    alias_to: MaintenanceWindow.Tz
  - name: maintenance-week-day
    alias_to: MaintenanceWindow.WeekDay
  - name: name
    alias_to: Name
    required: true
  - name: project
    alias_to: ProjectId
  - name: quirk
    alias_to: Quirks
  - name: tags
    alias_to: Tags
    help: 'Tags (key=value,key=value)'
  - name: version
    alias_to: Version
    required: false
- entity: cluster
  use: kubeconfig id_or_name
  alias_help: GetKubeconfig id_or_name
  alias_to: GetKubeconfig
  command:
  - api
  - GetKubeconfig
  - '%0'
  - --output
  - text
  flags:
  - name: group
    alias_to: Group
  - name: user
    alias_to: User
  - name: ttl
    alias_to: Ttl
    help: "TTL in human readable format (5h, 1d, 1w)"
  - name: print-path
    kind: 1
    alias_to: print-path
    help: "Print path to saved kubeconfig"
- entity: quota
  use: describe
  aliases:
  - desc
  alias_to: GetQuotas
  alias_help: GetQuotas
  command:
  - api
  - GetQuotas
  - --output
  - yaml
  - --single
