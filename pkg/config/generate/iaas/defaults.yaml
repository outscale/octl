api:
  ReadConsoleOutput:
    content: ConsoleOutput
    group: Vm
entities:
  accesskey:
    aliases:
      - ak
    columns:
      - title: ID
        content: .AccessKeyId
      - title: Tag
        content: .Tag
      - title: State
        content: .State
      - title: ExpirationDate
        content: .ExpirationDate
  apiaccessrule:
    columns:
      - title: ID
        content: .ApiAccessRuleId
      - title: Description
        content: .Description
      - title: CA
        content: .CaIds
      - title: CN
        content: .Cns
      - title: IP Ranges
        content: .IpRanges
  apilog:
    aliases:
      - log
    columns:
      - title: Date
        content: .QueryDate
      - title: IP
        content: .QueryIpAddress
      - title: Call
        content: .QueryCallName
      - title: Payload
        content: .QueryPayloadRaw
      - title: Status
        content: .ResponseStatusCode
      - title: Request ID
        content: .RequestId
      - title: UserAgent
        content: .QueryUserAgent
  catalog:
    explode: true
    sort: true
    columns:
      - title: Service
        content: ".Entries[].Service"
      - title: Category
        content: ".Entries[].Category"
      - title: Title
        content: ".Entries[].Title"
      - title: UnitPrice
        content: ".Entries[].UnitPrice"
      - title: Flags
        content: ".Entries[].Flags"
  consoleoutput:
    no_aliases: true
  consumptionaccount:
    aliases:
      - consumption
    columns:
      - title: From
        content: .FromDate
      - title: To
        content: .ToDate
      - title: Account
        content: .AccountId
      - title: Category
        content: .Category
      - title: Service
        content: .Service
      - title: Subregion
        content: .SubregionName
      - title: Operation
        content: .Operation
      - title: Value
        content: .Value
      - title: Unit Price
        content: .UnitPrice
      - title: Price
        content: .Price
  exporttask:
    primary: ExportTaskId
    title: ExportTask
  flexiblegpu:
    aliases:
      - fgpu
  flexiblegpucatalog:
    no_aliases: true
    columns:
      - title: Name
        content: .ModelName
      - title: VRAM
        content: .VRam
      - title: Max CPu
        content: .MaxCpu
      - title: Max RAM
        content: .MaxRam
      - title: Generations
        content: .Generations
  image:
    columns:
      - title: ID
        content: .ImageId
      - title: Name
        content: .ImageName
      - title: Account
        content: .AccountAlias // .AccountId
      - title: Created On
        content: .CreationDate
  imageexporttask:
    primary: TaskId
  listenerrule:
    primary: ListenerRuleName
  loadbalancer:
    aliases:
      - lb
      - lbu
  loadbalancerlistener:
    title: LoadBalancerListener
  loadbalancerpolicy:
    title: LoadBalancerPolicy
  loadbalancertag:
    columns:
      - title: LBU
        content: .LoadBalancerName
      - title: Key
        content: .Key
      - title: Value
        content: .Value
  location:
    columns:
      - title: Code
        content: .Code
      - title: Name
        content: .Name
  natservice:
    aliases:
      - nat
    columns:
      - title: ID
        content: .NatServiceId
      - title: Name
        content: '.Tags[] | select(.Key == "Name").Value'
      - title: State
        content: .State
      - title: PublicIp
        content: ".PublicIps[].PublicIp"
      - title: NetId
        content: .NetId
      - title: SubnetId
        content: .SubnetId
  netaccesspointservice:
    no_aliases: true
    columns:
      - title: ID
        content: .ServiceId
      - title: Name
        content: .ServiceName
      - title: IP Ranges
        content: .IpRanges
  netpeering:
    columns:
    - title: ID
      content: .NetPeeringId
    - title: Name
      content: .Tags[] | select(.Key == "Name").Value
    - title: State
      content: .State.Name
    primary: NetPeeringId
  policy:
    no_aliases: true
    columns:
      - title: ORN
        content: .Orn
      - title: Name
        content: .PolicyName
      - title: Default Version
        content: .PolicyDefaultVersionId
      - title: Resources Count
        content: .ResourcesCount
    primary: PolicyOrn
  policyversion:
    no_aliases: true
    columns:
      - title: Version
        content: .VersionId
      - title: Default
        content: .DefaultVersion
      - title: Date
        content: .CreationDate
    primary: PolicyOrn
  quota:
    explode: true
    columns:
      - title: Type
        content: .QuotaType
      - title: Collection
        content: ".Quotas[].QuotaCollection"
      - title: Name
        content: ".Quotas[].Name"
      - title: Used
        content: ".Quotas[].UsedValue"
      - title: Max
        content: ".Quotas[].MaxValue"
      - title: Description
        content: ".Quotas[].Description"
    primary: QuotaName
  route:
    title: Route
  snapshot:
    aliases:
      - snap
    columns:
      - title: ID
        content: .SnapshotId
      - title: Name
        content: '.Tags[] | select(.Key == "Name").Value'
      - title: State
        content: .State
      - title: Volume
        content: .VolumeId
      - title: Size
        content: .VolumeSize
      - title: CreationDate
        content: .CreationDate
  securitygroup:
    aliases:
      - sg
  securitygrouprule:
    title: SecurityGroupRule
    aliases:
      - sgr
    columns:
      - title: ID
        content: .SecurityGroupRuleId
      - title: Protocol
        content: .IpProtocol
      - title: PortRange
        content: .FromPortRange+"-"+.ToPortRange
      - title: IpRange
        content: .IpRange
  snapshotexporttask:
    primary: TaskId
  tag:
    columns:
      - title: Resource
        content: .ResourceId
      - title: Type
        content: .ResourceType
      - title: Key
        content: .Key
      - title: Value
        content: .Value
  user:
    columns:
      - title: Name
        content: .UserName
      - title: Email
        content: .UserEmail
    primary: UserName
  usergroup:
    primary: UserGroupName
  vmshealth:
    columns:
      - title: VM
        content: .VmId
      - title: State
        content: .State
  vmsstate:
    columns:
      - title: VM ID
        content: .VmId
      - title: SubregionName
        content: .SubregionName
      - title: State
        content: .VmState
  vmsstophistory:
    columns:
      - title: Date
        content: .StopDate
      - title: VM
        content: .VmId
      - title: Reason
        content: .StateReason
  volume:
    aliases:
      - vol
    columns:
      - title: ID
        content: .VolumeId
      - title: Name
        content: '.Tags[] | select(.Key == "Name").Value'
      - title: Type
        content: .VolumeType
      - title: State
        content: .State
      - title: Size
        content: .Size
      - title: Iops
        content: .Iops
      - title: VM
        content: ".LinkedVolumes[].VmId"
      - title: Device
        content: ".LinkedVolumes[].DeviceName"
  volumeupdatetask:
    primary: TaskId
  vpnconnectionroute:
    title: VpnConnectionRoute
aliases:
  - entity: flexiblegpu
    group: flexiblegpu
    use: catalog
    alias_to: ReadFlexibleGpuCatalog
    alias_help: ReadFlexibleGpuCatalog
    command:
      - api
      - ReadFlexibleGpuCatalog
      - --output
      - table
  - entity: flexiblegpu
    group: flexiblegpu
    use: link fgpu_id
    alias_to: LinkFlexibleGpu
    alias_help: LinkFlexibleGpu --FlexibleGpuId fgpu_id
    command:
      - api
      - LinkFlexibleGpu
      - --FlexibleGpuId
      - "%0"
      - --output
      - success
    flags:
      - name: vm-id
        alias_to: VmId
        required: true
  - entity: flexiblegpu
    group: flexiblegpu
    use: unlink fgpu_id
    alias_to: UnlinkFlexibleGpu
    alias_help: UnlinkFlexibleGpu --FlexibleGpuId fgpu_id
    command:
      - api
      - UnlinkFlexibleGpu
      - --FlexibleGpuId
      - "%0"
      - --output
      - success
  - entity: internetservice
    group: internetservice
    use: link service_id
    alias_to: LinkInternetService
    alias_help: LinkInternetService --InternetServiceId service_id
    command:
      - api
      - LinkInternetService
      - --InternetServiceId
      - "%0"
      - --output
      - success
    flags:
      - name: net-id
        alias_to: NetId
        required: true
  - entity: internetservice
    group: internetservice
    use: unlink service_id
    alias_to: UnlinkInternetService
    alias_help: UnlinkInternetService --InternetServiceId service_id
    command:
      - api
      - UnlinkInternetService
      - --InternetServiceId
      - "%0"
      - --output
      - success
    flags:
      - name: net-id
        alias_to: NetId
        required: true
  - entity: loadbalancer
    group: loadbalancer
    use: backends load_balancer_name
    alias_to: ReadVmsHealth
    alias_help: ReadVmsHealth --LoadBalancerName load_balancer_name
    command:
      - api
      - ReadVmsHealth
      - --LoadBalancerName
      - "%0"
      - --output
      - table
  - entity: nic
    group: nic
    use: link nic_id
    alias_to: LinkNic
    alias_help: LinkNic --NicId nic_id
    command:
      - api
      - LinkNic
      - --NicId
      - "%0"
      - --output
      - yaml
    flags:
      - name: vm-id
        alias_to: VmId
        required: true
      - name: device-number
        alias_to: DeviceNumber
        required: true
  - entity: nic
    group: nic
    use: unlink nic_id
    alias_to: UnlinkNic
    alias_help: ReadNics --Filters.NicIds nic_id | UnlinkNic --LinkNicId {{.LinkNic.LinkNicId}}
    command:
      - api
      - ReadNics
      - --Filters.NicIds
      - "%0"
      - --single
      - --output
      - json
      - "|"
      - api
      - UnlinkNic
      - --LinkNicId
      - "{{.LinkNic.LinkNicId}}"
      - --output
      - success
  - entity: netaccesspoint
    group: netaccesspoint
    use: services
    alias_to: ReadNetAccessPointServices
    alias_help: ReadNetAccessPointServices
    command:
      - api
      - ReadNetAccessPointServices
      - --output
      - table
  - entity: netpeering
    group: netpeering
    use: accept netpeering_id
    alias_to: AcceptNetPeering
    alias_help: AcceptNetPeering --NetPeeringId netpeering_id
    command:
      - api
      - AcceptNetPeering
      - --NetPeeringId
      - "%0"
      - --output
      - success
  - entity: netpeering
    group: netpeering
    alias_to: RejectNetPeering
    use: reject netpeering_id
    alias_help: RejectNetPeering --NetPeeringId netpeering_id
    command:
      - api
      - RejectNetPeering
      - --NetPeeringId
      - "%0"
      - --output
      - success
  - entity: policy
    group: policy
    use: list
    aliases:
      - ls
    alias_to: ReadPolicies
    alias_help: ReadPolicies
    command:
      - api
      - ReadPolicies
      - --output
      - table
    flags:
      - name: only-linked
        alias_to: Filters.OnlyLinked
      - name: path-prefix
        alias_to: Filters.PathPrefix
      - name: scope
        alias_to: Filters.Scope
      - name: first-item
        alias_to: FirstItem
  - entity: policy
    group: policy
    use: describe policy_orn
    aliases:
      - desc
    alias_to: ReadPolicy
    alias_help: ReadPolicy --PolicyOrn policy_orn
    command:
      - api
      - ReadPolicy
      - --PolicyOrn
      - "%0"
      - --output
      - yaml
  - entity: policy
    group: policy
    use: create
    alias_to: CreatePolicy
    alias_help: CreatePolicy
    command:
      - api
      - CreatePolicy
      - --output
      - yaml
    flags:
      - name: description
        alias_to: Description
      - name: document
        alias_to: Document
        required: true
        type: fileOrJSON
        help: Either a file storing the policy document or the policy document (in JSON format).
      - name: path
        alias_to: Path
      - name: name
        alias_to: PolicyName
        required: true
  - entity: policy
    group: policy
    use: delete policy_orn
    aliases:
      - del
    alias_to: DeletePolicy
    alias_help: DeletePolicy --PolicyOrn policy_orn
    command:
      - api
      - DeletePolicy
      - --PolicyOrn
      - "%0"
      - --output
      - none
    prompt:
      action: delete
      display:
        - api
        - ReadPolicy
        - --PolicyOrn
        - "%0"
        - --output
        - table
  - entity: policy
    group: policy
    use: link policy_orn
    alias_help: LinkPolicy --PolicyOrn policy_orn
    alias_to: LinkPolicy
    command:
      - api
      - LinkPolicy
      - --PolicyOrn
      - "%0"
      - --output
      - success
    flags:
      - name: user-name
        alias_to: UserName
        required: true
  - entity: policy
    group: policy
    use: unlink policy_orn
    alias_help: UnlinkPolicy --PolicyOrn policy_orn
    alias_to: UnlinkPolicy
    command:
      - api
      - UnlinkPolicy
      - --PolicyOrn
      - "%0"
      - --output
      - success
    flags:
      - name: user-name
        alias_to: UserName
        required: true
  - entity: policyversion
    group: policyversion
    use: list policy_orn
    alias_to: ReadPolicyVersions
    aliases:
      - ls
    alias_help: ReadPolicyVersions --PolicyOrn policy_orn
    command:
      - api
      - ReadPolicyVersions
      - --PolicyOrn
      - "%0"
      - --output
      - table
  - entity: policyversion
    group: policyversion
    use: describe policy_orn version
    aliases:
      - desc
    alias_to: ReadPolicyVersion
    alias_help: ReadPolicyVersion --PolicyOrn policy_orn
    command:
      - api
      - ReadPolicyVersion
      - --PolicyOrn
      - "%0"
      - --output
      - yaml
    flags:
      - name: version
        alias_to: VersionId
        required: true
  - entity: policyversion
    group: policyversion
    use: create policy_orn
    alias_to: CreatePolicyVersion
    alias_help: CreatePolicyVersion --PolicyOrn policy_orn
    command:
      - api
      - CreatePolicyVersion
      - --PolicyOrn
      - "%0"
      - --output
      - yaml
    flags:
      - name: document
        alias_to: Document
        required: true
        type: fileOrJSON
        help: Either a file storing the policy document, or the policy document (in JSON format).
      - name: default
        alias_to: SetAsDefault
  - entity: policyversion
    group: policyversion
    use: delete policy_orn
    aliases:
      - del
    alias_to: DeletePolicyVersion
    alias_help: DeletePolicyVersion --PolicyOrn policy_orn
    command:
      - api
      - DeletePolicyVersion
      - --PolicyOrn
      - "%0"
      - --output
      - none
    flags:
      - name: version
        alias_to: VersionId
        required: true
    prompt:
      action: delete
      display:
        - api
        - ReadPolicyVersion
        - --PolicyOrn
        - "%0"
        - --output
        - table
      flags:
        - name: version
          alias_to: VersionId
  - entity: policyversion
    group: policyversion
    use: set-default policy_orn
    aliases:
      - default
    alias_to: SetDefaultPolicyVersion
    alias_help: SetDefaultPolicyVersion --PolicyOrn policy_orn
    command:
      - api
      - SetDefaultPolicyVersion
      - --PolicyOrn
      - "%0"
      - --output
      - success
    flags:
      - name: version
        alias_to: VersionId
        required: true
  - entity: volume
    group: volume
    use: link volume_id
    alias_to: LinkVolume
    alias_help: LinkVolume --VolumeId volume_id
    command:
      - api
      - LinkVolume
      - --VolumeId
      - "%0"
      - --output
      - success
    flags:
      - name: vm-id
        alias_to: VmId
        required: true
      - name: device_name
        alias_to: DeviceName
        required: true
  - entity: volume
    group: volume
    use: unlink volume_id
    alias_to: UnlinkVolume
    alias_help: UnlinkVolume --VolumeId link_volume_id
    command:
      - api
      - UnlinkVolume
      - --VolumeId
      - "%0"
      - --output
      - success
    flags:
      - name: force
        alias_to: ForceUnlink
  - entity: vm
    group: vm
    use: start vm_id [vm_id]...
    alias_to: StartVms
    alias_help: StartVms --VmIds vm_id
    command:
      - api
      - StartVms
      - --VmIds
      - "%*"
      - --output
      - success
  - entity: vm
    group: vm
    use: stop vm_id [vm_id]...
    alias_to: StopVms
    alias_help: StopVms --VmIds vm_id
    command:
      - api
      - StopVms
      - --VmIds
      - "%*"
      - --output
      - success
    flags:
      - name: force
        alias_to: ForceStop
  - entity: vm
    group: vm
    use: readconsole vm_id
    alias_to: ReadConsoleOutput
    alias_help: ReadConsoleOutput --VmId vm_id
    command:
      - api
      - ReadConsoleOutput
      - --VmId
      - "%0"
      - --decode
      - --split
      - --skip
      - "1"
      - --output
      - text
  - entity: vm
    use: states
    alias_to: ReadVmsState
    alias_help: ReadVmsState
    command:
      - api
      - ReadVmsState
      - --output
      - table
  - entity: consumptionaccount
    use: list
    alias_to: ReadConsumptionAccount
    aliases:
    - ls
    alias_help: ReadConsumptionAccount
    command:
    - api
    - ReadConsumptionAccount
    - --output
    - table
    flags:
    - name: from-date
      alias_to: FromDate
      default: beginning-of-month
    - name: overall
      alias_to: Overall
    - name: show-price
      alias_to: ShowPrice
    - name: show-resource-details
      alias_to: ShowResourceDetails
    - name: to-date
      alias_to: ToDate
      default: today
  - entity: consumptionaccount
    sub_command: aggregate
    use: compute
    alias_to: ReadConsumptionAccount
    short: Aggregate all compute costs using ReadConsumptionAccount
    alias_help: ReadConsumptionAccount
    command:
    - api
    - ReadConsumptionAccount
    - --ShowPrice
    - --jq
    - |
      [
        .ConsumptionEntries[]
        | select(
            (.Operation == "RunInstances-OD" and (.Type | test("^BoxUsage:")))
            or
            (.Operation == "RunDedicatedInstances-OD" and (.Type | test("^BoxUsage:")))           or
            (.Operation == "RunDedicatedInstances" and .Type == "UseDedicated")                   or
            (.Operation == "RunDedicatedGroupsInstances" and .Type == "UseDedicatedGroups")
          )
      ]
      | map(.Price)
      | add
    - --single
    - --output
    - raw
    flags:
    - name: from-date
      alias_to: FromDate
      default: beginning-of-month
    - name: overall
      alias_to: Overall
    - name: to-date
      alias_to: ToDate
      default: today
  - entity: consumptionaccount
    sub_command: aggregate
    use: gpu
    alias_to: ReadConsumptionAccount
    short: Aggregate all GPU costs using ReadConsumptionAccount
    alias_help: ReadConsumptionAccount
    command:
    - api
    - ReadConsumptionAccount
    - --ShowPrice
    - --jq
    - |
      [
        .ConsumptionEntries[]
        | select(.Operation == "AllocateGpu")
      ]
      | map(.Price)
      | add
    - --single
    - --output
    - raw
    flags:
    - name: from-date
      alias_to: FromDate
      default: beginning-of-month
    - name: overall
      alias_to: Overall
    - name: to-date
      alias_to: ToDate
      default: today
  - entity: consumptionaccount
    sub_command: aggregate
    use: all
    alias_to: ReadConsumptionAccount
    short: Aggregate all costs using ReadConsumptionAccount
    alias_help: ReadConsumptionAccount
    command:
    - api
    - ReadConsumptionAccount
    - --ShowPrice
    - --jq
    - .ConsumptionEntries
      | map(.Price)
      | add
    - --single
    - --output
    - raw
    flags:
    - name: from-date
      alias_to: FromDate
      default: beginning-of-month
    - name: overall
      alias_to: Overall
    - name: to-date
      alias_to: ToDate
      default: today
  - entity: apilog
    use: list
    alias_to: ReadApiLogs
    aliases:
    - ls
    short: List API call logs
    alias_help: ReadApiLogs
    command:
    - api
    - ReadApiLogs
    - --output
    - table
    flags:
    - name: access-key
      alias_to: Filters.QueryAccessKeys
    - name: api
      alias_to: Filters.QueryApiNames
    - name: call
      alias_to: Filters.QueryCallNames
    - name: after
      alias_to: Filters.QueryDateAfter
    - name: before
      alias_to: Filters.QueryDateBefore
    - name: ip
      alias_to: Filters.QueryIpAddresses
    - name: user-agent
      alias_to: Filters.QueryUserAgents
    - name: request-id
      alias_to: Filters.RequestIds
    - name: status
      alias_to: Filters.ResponseStatusCodes
  - entity: apilog
    use: tail
    alias_to: ReadApiLogs
    short: Streams recent API call logs (similar to tail -f)
    alias_help: ReadApiLogs
    command:
    - api
    - ReadApiLogs
    - --output
    - table
    - --max-pages
    - 1
    - --ResultsPerPage
    - 20
    - --reverse
    - --watch
    - --elapsed=false
    flags:
    - name: access-key
      alias_to: Filters.QueryAccessKeys
    - name: api
      alias_to: Filters.QueryApiNames
    - name: call
      alias_to: Filters.QueryCallNames
    - name: ip
      alias_to: Filters.QueryIpAddresses
    - name: user-agent
      alias_to: Filters.QueryUserAgents
    - name: status
      alias_to: Filters.ResponseStatusCodes
  - entity: vm
    group: vm
    use: stophistory
    alias_to: ReadVmsStopHistory
    alias_help: ReadVmsStopHistory
    command:
    - api
    - ReadVmsStopHistory
    - --output
    - table
    flags:
    - name: reason
      alias_to: Filters.StateReasons
    - name: after
      alias_to: Filters.StopDateAfter
    - name: before
      alias_to: Filters.StopDateBefore
    - name: vm-id
      alias_to: Filters.VmIds
  - entity: securitygroup
    use: rules id
    alias_to: ReadSecurityGroups
    alias_help: ReadSecurityGroups
    help: Lists all rules from a security group.
    command:
    - api
    - ReadSecurityGroups
    - --Filters.SecurityGroupIds
    - '%0'
    - --jq
    - '([.InboundRules[]|.+{"Flow":"Inbound"}]+[.OutboundRules[]|.+{"Flow":"Outbound"}])[]'
    - --columns
    - 'Flow:.Flow||Protocol:if .IpProtocol == "-1" then "any (-1)" else .IpProtocol end||FromPort:if .FromPortRange == -1 then "any (-1)" else .FromPortRange end||ToPort:if .ToPortRange == -1 then "any (-1)" else .ToPortRange end||IpRanges:.IpRanges'
    - --output
    - table
  - entity: securitygrouprule
    use: create
    alias_to: CreateSecurityGroupRule
    aliases:
    - add
    alias_help: CreateSecurityGroupRule
    command:
    - api
    - CreateSecurityGroupRule
    - --output
    - yaml
    - --single
    flags:
    - name: flow
      alias_to: Flow
      default: Inbound
    - name: ports
      help: A list of either protocol (all ports from a protocol, e.g. icmp), protocol/port (a single port/protocol, e.g. tcp/80) or protocol/from-to (a range, e.g. tcp/8080-8082)
      required: true
      kind: 24
      container: 23
    - name: remote-ranges
      alias_to: 'Rules.#.IpRanges'
    - name: remote-account
      alias_to: 'Rules.#.SecurityGroupsMembers.#.AccountId'
    - name: remote-security-group
      alias_to: 'Rules.#.SecurityGroupsMembers.#.SecurityGroupId'
    - name: remote-security-group-name
      alias_to: 'Rules.#.SecurityGroupsMembers.#.SecurityGroupName'
    - name: remote-service
      alias_to: 'Rules.#.ServiceIds'
    - name: from-port
      alias_to: 'Rules.#.FromPortRange'
      hidden: true
