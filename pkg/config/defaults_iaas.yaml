      Detaches a flexible GPU (fGPU) from a virtual machine (VM).
      
      The fGPU is in the `detaching` state until the VM is stopped, after which it becomes `allocated`. It is then available again for attachment to a VM.
    short: Detaches a flexible GPU (fGPU) from a virtual machine (VM).
  UnlinkInternetService:
    use: UnlinkInternetService
    entity: internetservice
    group: InternetService
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: InternetServiceId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the internet service you want to detach.'
    - name: NetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net from which you want to detach the internet service.'
    help: |-
      Detaches an internet service from a Net.
      
      This action disables and detaches an internet service from a Net. The Net must not contain virtual machines (VMs) using public IPs nor internet-facing load balancers.
    short: Detaches an internet service from a Net.
  UnlinkLoadBalancerBackendMachines:
