    - name: 'BlockDeviceMappings.#.NoDevice'
      kind: 24
      help: Removes the device which is included in the block device mapping of the OMI.
    - name: 'BlockDeviceMappings.#.VirtualDeviceName'
      kind: 24
      help: The name of the virtual device (ephemeralN).
    - name: BsuOptimized
      kind: 1
      help: This parameter is not available.
    - name: DeletionProtection
      kind: 1
      help: If true, you cannot delete the VM unless you change this parameter back to false.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: IsSourceDestChecked
      kind: 1
      help: (Net only) If true, the source/destination check is enabled.
    - name: KeypairName
      kind: 24
      help: The name of a keypair you want to associate with the VM.
    - name: NestedVirtualization
      kind: 1
      help: (dedicated tenancy only) If true, nested virtualization is enabled.
    - name: Performance
      kind: 24
      help: The performance of the VM.
      values:
      - high
      - highest
      - medium
    - name: SecurityGroupIds
      kind: 24
      container: 23
      help: One or more IDs of security groups for the VM.
    - name: ShutdownBehaviorConfiguration.GuestAction
      kind: 24
      help: The action performed by the orchestrator when the VM is shut down from the guest operating system.
      values:
      - stop
      - terminate
    - name: ShutdownBehaviorConfiguration.HostAction
      kind: 24
      help: The action performed by the orchestrator when the VM is shut down due to a host infrastructure failure.
      values:
      - restart
      - stop
    - name: UserData
      kind: 24
      customValue: base64File
      help: The file storing the data or script used to add a specific configuration to the VM (max size 500 KiB).
    - name: VmId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the VM.'
    - name: VmInitiatedShutdownBehavior
      kind: 24
      help: The VM behavior when you stop it.
