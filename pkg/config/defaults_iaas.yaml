      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: VmIds
      kind: 24
      container: 23
      help: One or more IDs of VMs.
    help: |-
      Start one or more virtual machines (VMs).
      
      You can start only VMs that are valid and that belong to you.
    short: Start one or more virtual machines (VMs).
  StopVms:
    use: StopVms
    content: Vms
    entity: vm
    group: Vm
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: ForceStop
      kind: 1
      help: Forces the VM to stop.
    - name: VmIds
      kind: 24
      container: 23
      help: One or more IDs of VMs.
    help: |-
      Stops one or more running virtual machines (VMs).
      
      You can stop only VMs that are valid and that belong to you. Data stored in the VM RAM is lost.
    short: Stops one or more running virtual machines (VMs).
  UnlinkFlexibleGpu:
    use: UnlinkFlexibleGpu
    entity: flexiblegpu
