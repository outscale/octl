      Unlinks a managed policy from a specific group.
      
      
      
      
      **[IMPORTANT]**
      
      A delay of up to 15 seconds can occur when attaching, detaching, or updating a managed policy.
    short: Unlinks a managed policy from a specific group.
  UnlinkNic:
    use: UnlinkNic
