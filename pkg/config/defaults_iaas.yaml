api:
  AcceptNetPeering:
    use: AcceptNetPeering
    content: NetPeering
    entity: netpeering
    group: NetPeering
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NetPeeringId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net peering you want to accept.'
    help: |-
      Accepts a Net peering request.
      
      To accept this request, you must be the owner of the peer Net. If you do not accept the request within 7 days, the state of the Net peering becomes `expired`.
      
      
      
      **[NOTE]**
      
      A peering connection between two Nets works both ways. Therefore, when an A-to-B peering connection is accepted, any pending B-to-A peering connection is automatically rejected as redundant.
    short: Accepts a Net peering request.
  AddUserToUserGroup:
    use: AddUserToUserGroup
    entity: usertousergroup
    group: UserGroup
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: UserGroupName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the group you want to add a user to.'
    - name: UserGroupPath
      kind: 24
      help: The path to the group.
    - name: UserName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the user you want to add to the group.'
    - name: UserPath
      kind: 24
      help: The path to the user.
    help: Adds a user to a specified group.
    short: Adds a user to a specified group.
  CheckAuthentication:
    use: CheckAuthentication
    entity: authentication
    group: Account
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Login
      required: true
      kind: 24
      help: '[REQUIRED] The email address of the account.'
    - name: Password
      required: true
      kind: 24
      help: '[REQUIRED] The password of the account.'
    help: Validates the authenticity of the OUTSCALE account.
    short: Validates the authenticity of the OUTSCALE account.
  CreateAccessKey:
    use: CreateAccessKey
    content: AccessKey
    entity: accesskey
    group: AccessKey
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: ExpirationDate
      kind: 24
      customValue: osctime
      help: The date and time, or the date, at which you want the access key to expire, in ISO 8601 format (for example, 2020-06-14T00:00:00.000Z, or 2020-06-14).
    - name: Tag
      kind: 24
      help: A tag to add to the access key.
    - name: UserName
      kind: 24
      help: The name of the EIM user that owns the key to be created.
    help: |-
      Creates an access key for either the root user or an EIM user. The new key is automatically set to `ACTIVE`.
      
      
      For more information, see [About Access Keys](https://docs.outscale.com/en/userguide/About-Access-Keys.html).
    short: Creates an access key for either the root user or an EIM user.
  CreateAccount:
    use: CreateAccount
    content: Account
    entity: account
    group: Account
    flags:
    - name: AdditionalEmails
      kind: 24
      container: 23
      help: One or more additional email addresses for the account.
    - name: City
      required: true
      kind: 24
      help: '[REQUIRED] The city of the account owner.'
    - name: CompanyName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the company for the account.'
    - name: Country
      required: true
      kind: 24
      help: '[REQUIRED] The country of the account owner.'
    - name: CustomerId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the customer.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Email
      required: true
      kind: 24
      help: '[REQUIRED] The main email address for the account.'
    - name: FirstName
      required: true
      kind: 24
      help: '[REQUIRED] The first name of the account owner.'
    - name: JobTitle
      kind: 24
      help: The job title of the account owner.
    - name: LastName
      required: true
      kind: 24
      help: '[REQUIRED] The last name of the account owner.'
    - name: MobileNumber
      kind: 24
      help: The mobile phone number of the account owner.
    - name: PhoneNumber
      kind: 24
      help: The landline phone number of the account owner.
    - name: StateProvince
      kind: 24
      help: The state/province of the account.
    - name: VatNumber
      kind: 24
      help: The value added tax (VAT) number for the account.
    - name: ZipCode
      required: true
      kind: 24
      help: '[REQUIRED] The ZIP code of the city.'
    help: |-
      Creates an OUTSCALE account.
      
      
      
      **[IMPORTANT]**
      
      * You need OUTSCALE credentials and the appropriate quotas to create an account via API. To get quotas, you can send an email to sales@outscale.com.
      
      
      For more information, see [About Your Account](https://docs.outscale.com/en/userguide/About-Your-OUTSCALE-Account.html).
    short: Creates an OUTSCALE account.
  CreateApiAccessRule:
    use: CreateApiAccessRule
    content: ApiAccessRule
    entity: apiaccessrule
    group: ApiAccessRule
    flags:
    - name: CaIds
      kind: 24
      container: 23
      help: One or more IDs of Client Certificate Authorities (CAs).
    - name: Cns
      kind: 24
      container: 23
      help: One or more Client Certificate Common Names (CNs).
    - name: Description
      kind: 24
      help: A description for the API access rule.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: IpRanges
      kind: 24
      container: 23
      help: One or more IPs or CIDR blocks (for example, 192.0.2.0/16).
    help: |-
      Creates a rule to allow access to the API from your OUTSCALE account.
      
      You need to specify at least the `CaIds` or the `IpRanges` parameter.
      
      
      
      **[NOTE]**
      
      By default, your account has a set of rules allowing global access, that you can delete.
      
      
      For more information, see [About API Access Rules](https://docs.outscale.com/en/userguide/About-API-Access-Rules.html).
    short: Creates a rule to allow access to the API from your OUTSCALE account.
  CreateCa:
    use: CreateCa
    content: Ca
    entity: ca
    group: Ca
    flags:
    - name: CaPem
      required: true
      kind: 24
      help: '[REQUIRED] The CA in PEM format.'
    - name: Description
      kind: 24
      help: The description of the CA.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: |-
      Creates a Client Certificate Authority (CA).
      
      
      For more information, see [About API Access Rules](https://docs.outscale.com/en/userguide/About-API-Access-Rules.html).
    short: Creates a Client Certificate Authority (CA).
  CreateClientGateway:
    use: CreateClientGateway
    content: ClientGateway
    entity: clientgateway
    group: ClientGateway
    flags:
    - name: BgpAsn
      required: true
      kind: 2
      help: '[REQUIRED] The Autonomous System Number (ASN) used by the Border Gateway Protocol (BGP) to find the path to your client gateway through the Internet.'
    - name: ConnectionType
      required: true
      kind: 24
      help: '[REQUIRED] The communication protocol used to establish tunnel with your client gateway (always ipsec.1).'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PublicIp
      required: true
      kind: 24
      help: '[REQUIRED] The public fixed IPv4 address of your client gateway.'
    help: |-
      Provides information about your client gateway.
      
      This action registers information to identify the client gateway that you deployed in your network.
      
      To open a tunnel to the client gateway, you must provide the communication protocol type, the fixed public IP of the gateway, and an Autonomous System Number (ASN).
      
      
      For more information, see [About Client Gateways](https://docs.outscale.com/en/userguide/About-Client-Gateways.html).
    short: Provides information about your client gateway.
  CreateDedicatedGroup:
    use: CreateDedicatedGroup
    content: DedicatedGroup
    entity: dedicatedgroup
    group: DedicatedGroup
    flags:
    - name: CpuGeneration
      required: true
      kind: 2
      help: '[REQUIRED] The processor generation for the VMs in the dedicated group (for example, 4).'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Name
      required: true
      kind: 24
      help: '[REQUIRED] A name for the dedicated group.'
    - name: SubregionName
      required: true
      kind: 24
      help: '[REQUIRED] The Subregion in which you want to create the dedicated group.'
    help: |-
      Creates a dedicated group for virtual machines (VMs).
      
      
      For more information, see [About Dedicated Groups](https://docs.outscale.com/en/userguide/About-Dedicated-Groups.html).
    short: Creates a dedicated group for virtual machines (VMs).
  CreateDhcpOptions:
    use: CreateDhcpOptions
    content: DhcpOptionsSet
    entity: dhcpoption
    group: DhcpOption
    flags:
    - name: DomainName
      kind: 24
      help: Specify a domain name (for example, MyCompany.com).
    - name: DomainNameServers
      kind: 24
      container: 23
      help: The IPs of domain name servers.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: LogServers
      kind: 24
      container: 23
      help: The IPs of the log servers.
    - name: NtpServers
      kind: 24
      container: 23
      help: The IPs of the Network Time Protocol (NTP) servers.
    help: |-
      Creates a set of DHCP options, that you can then associate with a Net using the [UpdateNet](#updatenet) method.
      
      
      For more information, see [About DHCP Options](https://docs.outscale.com/en/userguide/About-DHCP-Options.html).
    short: 'Creates a set of DHCP options, that you can then associate with a Net using the [UpdateNet](#updatenet) method.'
  CreateDirectLink:
    use: CreateDirectLink
    content: DirectLink
    entity: directlink
    group: DirectLink
    flags:
    - name: Bandwidth
      required: true
      kind: 24
      help: '[REQUIRED] The bandwidth of the DirectLink (1Gbps | 10Gbps).'
    - name: DirectLinkName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the DirectLink.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Location
      required: true
      kind: 24
      help: '[REQUIRED] The code of the requested location for the DirectLink, returned by the [ReadLocations](#readlocations) method.'
    help: |-
      Creates a DirectLink between a customer network and a specified DirectLink location.
      
      
      For more information, see [About DirectLink](https://docs.outscale.com/en/userguide/About-DirectLink.html).
    short: Creates a DirectLink between a customer network and a specified DirectLink location.
  CreateDirectLinkInterface:
    use: CreateDirectLinkInterface
    content: DirectLinkInterface
    entity: directlinkinterface
    group: DirectLinkInterface
    flags:
    - name: DirectLinkId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the existing DirectLink for which you want to create the DirectLink interface.'
    - name: DirectLinkInterface.BgpAsn
      required: true
      kind: 2
      help: '[REQUIRED] '
    - name: DirectLinkInterface.BgpKey
      kind: 24
    - name: DirectLinkInterface.ClientPrivateIp
      kind: 24
    - name: DirectLinkInterface.DirectLinkInterfaceName
      required: true
      kind: 24
      help: '[REQUIRED] '
    - name: DirectLinkInterface.OutscalePrivateIp
      kind: 24
    - name: DirectLinkInterface.VirtualGatewayId
      required: true
      kind: 24
      help: '[REQUIRED] '
    - name: DirectLinkInterface.Vlan
      required: true
      kind: 2
      help: '[REQUIRED] '
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: |-
      Creates a DirectLink interface.
      
      DirectLink interfaces enable you to reach one of your Nets through a virtual gateway.
      
      
      For more information, see [About DirectLink](https://docs.outscale.com/en/userguide/About-DirectLink.html).
    short: Creates a DirectLink interface.
  CreateFlexibleGpu:
    use: CreateFlexibleGpu
    content: FlexibleGpu
    entity: flexiblegpu
    group: FlexibleGpu
    flags:
    - name: DeleteOnVmDeletion
      kind: 1
      help: If true, the fGPU is deleted when the VM is terminated.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Generation
      kind: 24
      help: The processor generation that the fGPU must be compatible with.
    - name: ModelName
      required: true
      kind: 24
      help: '[REQUIRED] The model of fGPU you want to allocate.'
    - name: SubregionName
      required: true
      kind: 24
      help: '[REQUIRED] The Subregion in which you want to create the fGPU.'
    help: |-
      Allocates a flexible GPU (fGPU) to your OUTSCALE account.
      
      You can then attach this fGPU to a virtual machine (VM).
      
      
      For more information, see [About Flexible GPUs](https://docs.outscale.com/en/userguide/About-Flexible-GPUs.html).
    short: Allocates a flexible GPU (fGPU) to your OUTSCALE account.
  CreateImage:
    use: CreateImage
    content: Image
    entity: image
    group: Image
    flags:
    - name: Architecture
      kind: 24
      help: '**(when registering from a snapshot)** The architecture of the OMI (i386 or x86_64).'
    - name: 'BlockDeviceMappings.#.Bsu.DeleteOnVmDeletion'
      kind: 1
      help: If set to true, the volume is deleted when terminating the VM.
    - name: 'BlockDeviceMappings.#.Bsu.Iops'
      kind: 2
      help: The number of I/O operations per second (IOPS).
    - name: 'BlockDeviceMappings.#.Bsu.SnapshotId'
      kind: 24
      help: The ID of the snapshot used to create the volume.
    - name: 'BlockDeviceMappings.#.Bsu.VolumeSize'
      kind: 2
      help: The size of the volume, in gibibytes (GiB).
    - name: 'BlockDeviceMappings.#.Bsu.VolumeType'
      kind: 24
      help: The type of the volume (standard | io1 | gp2).
      values:
      - gp2
      - io1
      - standard
    - name: 'BlockDeviceMappings.#.DeviceName'
      kind: 24
      help: The device name for the volume.
    - name: 'BlockDeviceMappings.#.VirtualDeviceName'
      kind: 24
      help: The name of the virtual device (ephemeralN).
    - name: BootModes
      kind: 24
      container: 23
      help: The boot modes compatible with the OMI.
      values:
      - legacy
      - uefi
    - name: Description
      kind: 24
      help: A description for the new OMI.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: FileLocation
      kind: 24
      help: '**(required when registering from a bucket by using a manifest file)** The pre-signed URL of the manifest file for the OMI you want to register.'
    - name: ImageName
      kind: 24
      help: A unique name for the new OMI.
    - name: NoReboot
      kind: 1
      help: '**(when creating from a VM)** If false, the VM shuts down before creating the OMI and then reboots.'
    - name: ProductCodes
      kind: 24
      container: 23
      help: The product codes associated with the OMI.
    - name: RootDeviceName
      kind: 24
      help: '**(required when registering from a snapshot)** The name of the root device for the new OMI.'
    - name: SourceImageId
      kind: 24
      help: '**(required when copying an OMI)** The ID of the OMI you want to copy.'
    - name: SourceRegionName
      kind: 24
      help: '**(required when copying an OMI)** The name of the source Region (always the same as the Region of your account).'
    - name: TpmMandatory
      kind: 1
      help: By default or if set to false, a virtual Trusted Platform Module (vTPM) is not mandatory on VMs created from this OMI.
    - name: VmId
      kind: 24
      help: '**(required when creating from a VM)** The ID of the VM from which you want to create the OMI.'
    help: |-
      Creates an OUTSCALE machine image (OMI).
      
      You can use this method for different use cases:
      * **Creating from a VM**: You create an OMI from one of your virtual machines (VMs).<br>
      * **Copying an OMI**: You copy an existing OMI. The source OMI can be one of your own OMIs, or an OMI owned by another OUTSCALE account that has granted you permission via the [UpdateImage](#updateimage) method.<br>
      * **Registering from a snapshot**: You register an OMI from an existing snapshot. The source snapshot can be one of your own snapshots, or a snapshot owned by another OUTSCALE account that has granted you permission via the [UpdateSnapshot](#updatesnapshot) method.<br>
      * **Registering from a bucket by using a manifest file**: You register an OMI from the manifest file of an OMI that was exported to an OUTSCALE Object Storage (OOS) bucket. First, the owner of the source OMI must export it to the bucket by using the [CreateImageExportTask](#createimageexporttask) method. Then, they must grant you permission to read the manifest file via a pre-signed URL. For more information, see [Creating a Pre-Signed URL](https://docs.outscale.com/en/userguide/Creating-a-Pre-Signed-URL.html).
      
      **[TIP]**
      
      Registering from a bucket enables you to copy an OMI across Regions.
      
      For more information, see [About OMIs](https://docs.outscale.com/en/userguide/About-OMIs.html).
    short: Creates an OUTSCALE machine image (OMI).
  CreateImageExportTask:
    use: CreateImageExportTask
    content: ImageExportTask
    entity: imageexporttask
    group: Image
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: ImageId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the OMI to export.'
    - name: OsuExport.DiskImageFormat
      required: true
      kind: 24
      help: '[REQUIRED] The format of the export disk (qcow2 | raw).'
    - name: OsuExport.OsuApiKey.ApiKeyId
      kind: 24
      help: The API key of the OOS account that enables you to access the bucket.
    - name: OsuExport.OsuApiKey.SecretKey
      kind: 24
      help: The secret key of the OOS account that enables you to access the bucket.
    - name: OsuExport.OsuBucket
      required: true
      kind: 24
      help: '[REQUIRED] The name of the OOS bucket where you want to export the object.'
    - name: OsuExport.OsuManifestUrl
      kind: 24
      help: The URL of the manifest file.
    - name: OsuExport.OsuPrefix
      kind: 24
      help: The prefix for the key of the OOS object.
    help: |-
      Exports an OUTSCALE machine image (OMI) to an OUTSCALE Object Storage (OOS) bucket.
      
      This enables you to copy an OMI between OUTSCALE accounts in different Regions.
      
      
      This action creates the necessary snapshots and manifest file in the bucket. The OMI can then be imported to another account using a pre-signed URL of its manifest file. For more information, see [Creating a Pre-Signed URL](https://docs.outscale.com/en/userguide/Creating-a-Pre-Signed-URL.html).
      
      
      To copy an OMI in the same Region, you can also use the [CreateImage](#createimage) method.
      
      
      **[IMPORTANT]**
      
      * You cannot export a shared or public OMI, as they do not belong to you. To do so, you must first copy it to your account. The copy then belongs to you and you can export it.
      
      * Export tasks can only be canceled while in the `pending/queued` state.
      
      For more information, see [About OMIs](https://docs.outscale.com/en/userguide/About-OMIs.html).
    short: Exports an OUTSCALE machine image (OMI) to an OUTSCALE Object Storage (OOS) bucket.
  CreateInternetService:
    use: CreateInternetService
    content: InternetService
    entity: internetservice
    group: InternetService
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: |-
      Creates an internet service you can use with a Net.
      
      An internet service enables virtual machines (VMs) launched in a Net to connect to the Internet. It allows routing of incoming and outgoing Internet traffic and management of public IPs.
      
      
      For more information, see [About Internet Services](https://docs.outscale.com/en/userguide/About-Internet-Services.html).
    short: Creates an internet service you can use with a Net.
  CreateKeypair:
    use: CreateKeypair
    content: Keypair
    entity: keypair
    group: Keypair
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: KeypairName
      required: true
      kind: 24
      help: '[REQUIRED] A unique name for the keypair, with a maximum length of 255 [ASCII printable characters](https://en.wikipedia.org/wiki/ASCII#Printable_characters).'
    - name: PublicKey
      kind: 24
      customValue: base64File
      help: The file storing the public key to import in your account, if you are importing an existing keypair.
    help: |-
      Creates a keypair to use with your virtual machines (VMs).
      
      You can use this method in two different ways:
      * **Creating a keypair**: In that case, 3DS OUTSCALE creates a 2048-bit RSA keypair, stores its public key in your OUTSCALE account, and returns its private key in the response of the call so that you can save it in a file.
      
      When you save the returned private key, make sure you replace the `\n` escape sequences with real line breaks.
      * **Importing a keypair created locally**: If you already have a keypair that you have created locally with a third-party tool, you can import its public key in your account. The following types of key can be imported: RSA (2048 bits or preferably 4096 bits), Ed25519, and ECDSA (256 bits, 384 bits, or 521 bits). The following formats can be used: PEM, PKCS8, RFC4716, and OpenSSH.
      
      For more information, see [About Keypairs](https://docs.outscale.com/en/userguide/About-Keypairs.html).
    short: Creates a keypair to use with your virtual machines (VMs).
  CreateListenerRule:
    use: CreateListenerRule
    content: ListenerRule
    entity: listenerrule
    group: Listener
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Listener.LoadBalancerName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the load balancer to which the listener is attached.'
    - name: Listener.LoadBalancerPort
      required: true
      kind: 2
      help: '[REQUIRED] The port of load balancer on which the load balancer is listening (between 1 and 65535 both included).'
    - name: ListenerRule.Action
      kind: 24
      help: The type of action for the rule (always forward).
    - name: ListenerRule.HostNamePattern
      kind: 24
      help: A host-name pattern for the rule, with a maximum length of 128 characters.
    - name: ListenerRule.ListenerRuleName
      required: true
      kind: 24
      help: '[REQUIRED] A human-readable name for the listener rule.'
    - name: ListenerRule.PathPattern
      kind: 24
      help: A path pattern for the rule, with a maximum length of 128 characters.
    - name: ListenerRule.Priority
      required: true
      kind: 2
      help: '[REQUIRED] The priority level of the listener rule, between 1 and 19999 both included.'
    - name: VmIds
      kind: 24
      container: 23
      help: The IDs of the backend VMs.
    help: |-
      Creates a rule for traffic redirection for the specified listener. Each rule must have either the `HostNamePattern` or `PathPattern` parameter specified. Rules are treated in priority order, from the highest value to the lowest value.
      
      Once the rule is created, you need to register backend VMs with it. For more information, see the [RegisterVmsInLoadBalancer](#registervmsinloadbalancer) method.
      
      
      For more information, see [About Load Balancers](https://docs.outscale.com/en/userguide/About-Load-Balancers.html).
    short: Creates a rule for traffic redirection for the specified listener.
  CreateLoadBalancer:
    use: CreateLoadBalancer
    content: LoadBalancer
    entity: loadbalancer
    group: LoadBalancer
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: 'Listeners.#.BackendPort'
      kind: 2
      help: The port on which the backend VM is listening (between 1 and 65535, both included).
    - name: 'Listeners.#.BackendProtocol'
      kind: 24
      help: The protocol for routing traffic to backend VMs (HTTP | HTTPS | TCP | SSL).
    - name: 'Listeners.#.LoadBalancerPort'
      kind: 2
      help: The port on which the load balancer is listening (between 1 and 65535, both included).
    - name: 'Listeners.#.LoadBalancerProtocol'
      kind: 24
      help: The routing protocol (HTTP | HTTPS | TCP | SSL).
    - name: 'Listeners.#.ServerCertificateId'
      kind: 24
      help: The OUTSCALE Resource Name (ORN) of the server certificate.
    - name: LoadBalancerName
      required: true
      kind: 24
      help: '[REQUIRED] The unique name of the load balancer, with a maximum length of 32 alphanumeric characters and dashes (-).'
    - name: LoadBalancerType
      kind: 24
      help: 'The type of load balancer: internet-facing or internal.'
    - name: PublicIp
      kind: 24
      help: (internet-facing only) The public IP you want to associate with the load balancer.
    - name: SecurityGroups
      kind: 24
      container: 23
      help: (Net only) One or more IDs of security groups you want to assign to the load balancer.
    - name: Subnets
      kind: 24
      container: 23
      help: (Net only) The ID of the Subnet in which you want to create the load balancer.
    - name: SubregionNames
      kind: 24
      container: 23
      help: (public Cloud only) The Subregion in which you want to create the load balancer.
    - name: 'Tags.#.Key'
      kind: 24
      help: The key of the tag, between 1 and 255 characters.
    - name: 'Tags.#.Value'
      kind: 24
      help: The value of the tag, between 0 and 255 characters.
    help: |-
      Creates a load balancer.
      
      The load balancer is created with a unique Domain Name Service (DNS) name. It receives the incoming traffic and routes it to its registered virtual machines (VMs).
      
      By default, this action creates an Internet-facing load balancer, resolving to public IPs. To create an internal load balancer in a Net, resolving to private IPs, use the `LoadBalancerType` parameter.
      
      You must specify either the `Subnets` or the `SubregionNames` parameters.
      
      
      For more information, see [About Load Balancers](https://docs.outscale.com/en/userguide/About-Load-Balancers.html).
    short: Creates a load balancer.
  CreateLoadBalancerListeners:
    use: CreateLoadBalancerListeners
    content: LoadBalancer
    entity: loadbalancerlistener
    group: Listener
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: 'Listeners.#.BackendPort'
      kind: 2
      help: The port on which the backend VM is listening (between 1 and 65535, both included).
    - name: 'Listeners.#.BackendProtocol'
      kind: 24
      help: The protocol for routing traffic to backend VMs (HTTP | HTTPS | TCP | SSL).
    - name: 'Listeners.#.LoadBalancerPort'
      kind: 2
      help: The port on which the load balancer is listening (between 1 and 65535, both included).
    - name: 'Listeners.#.LoadBalancerProtocol'
      kind: 24
      help: The routing protocol (HTTP | HTTPS | TCP | SSL).
    - name: 'Listeners.#.ServerCertificateId'
      kind: 24
      help: The OUTSCALE Resource Name (ORN) of the server certificate.
    - name: LoadBalancerName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the load balancer for which you want to create listeners.'
    help: |-
      Creates one or more listeners for a specified load balancer.
      
      
      For more information, see [About Load Balancers](https://docs.outscale.com/en/userguide/About-Load-Balancers.html).
    short: Creates one or more listeners for a specified load balancer.
  CreateLoadBalancerPolicy:
    use: CreateLoadBalancerPolicy
    content: LoadBalancer
    entity: loadbalancerpolicy
    group: LoadBalancerPolicy
    flags:
    - name: CookieExpirationPeriod
      kind: 2
      help: The lifetime of the cookie, in seconds.
    - name: CookieName
      kind: 24
      help: The name of the application cookie used for stickiness, between 1 and 255 characters.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: LoadBalancerName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the load balancer for which you want to create a policy.'
    - name: PolicyName
      required: true
      kind: 24
      help: '[REQUIRED] The unique name of the policy, with a maximum length of 32 alphanumeric characters and dashes (-).'
    - name: PolicyType
      required: true
      kind: 24
      help: '[REQUIRED] The type of stickiness policy you want to create: app or load_balancer.'
    help: |-
      Creates a stickiness policy with sticky session lifetimes defined by the browser lifetime.
      
      The created policy can be used with HTTP or HTTPS listeners only.
      
      If this policy is implemented by a load balancer, this load balancer uses this cookie in all incoming requests to direct them to the specified backend server virtual machine (VM). If this cookie is not present, the load balancer sends the request to any other server according to its load-balancing algorithm.
      
      
      
      You can also create a stickiness policy with sticky session lifetimes following the lifetime of an application-generated cookie.
      
      Unlike the other type of stickiness policy, the lifetime of the special Load Balancer Unit (LBU) cookie follows the lifetime of the application-generated cookie specified in the policy configuration. The load balancer inserts a new stickiness cookie only when the application response includes a new application cookie.
      
      The session stops being sticky if the application cookie is removed or expires, until a new application cookie is issued.
      
      
      For more information, see [About Load Balancers](https://docs.outscale.com/en/userguide/About-Load-Balancers.html).
    short: Creates a stickiness policy with sticky session lifetimes defined by the browser lifetime.
  CreateLoadBalancerTags:
    use: CreateLoadBalancerTags
    entity: loadbalancertag
    group: LoadBalancer
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: LoadBalancerNames
      kind: 24
      container: 23
      help: One or more load balancer names.
    - name: 'Tags.#.Key'
      kind: 24
      help: The key of the tag, between 1 and 255 characters.
    - name: 'Tags.#.Value'
      kind: 24
      help: The value of the tag, between 0 and 255 characters.
    help: |-
      Adds one or more tags to the specified load balancers.
      
      If a tag with the same key already exists for the load balancer, the tag value is replaced.
      
      
      For more information, see [About Tags](https://docs.outscale.com/en/userguide/About-Tags.html).
    short: Adds one or more tags to the specified load balancers.
  CreateNatService:
    use: CreateNatService
    content: NatService
    entity: natservice
    group: NatService
    flags:
    - name: ClientToken
      kind: 24
      help: A unique identifier which enables you to manage the idempotency.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PublicIpId
      required: true
      kind: 24
      help: '[REQUIRED] The allocation ID of the public IP to associate with the NAT service.'
    - name: SubnetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Subnet in which you want to create the NAT service.'
    help: |-
      Creates a network address translation (NAT) service in the specified public Subnet of a Net.
      
      A NAT service enables virtual machines (VMs) placed in the private Subnet of this Net to connect to the Internet, without being accessible from the Internet.
      
      When creating a NAT service, you specify the allocation ID of the public IP you want to use as public IP for the NAT service. Once the NAT service is created, you need to create a route in the route table of the private Subnet, with 0.0.0.0/0 as destination and the ID of the NAT service as target. For more information, see [LinkPublicIP](#linkpublicip) and [CreateRoute](#createroute).
      
      This action also enables you to create multiple NAT services in the same Net (one per public Subnet).
      
      
      
      **[IMPORTANT]**
      
      You cannot modify the public IP associated with a NAT service after its creation. To do so, you need to delete the NAT service and create a new one with another public IP.
      
      
      For more information, see [About NAT Services](https://docs.outscale.com/en/userguide/About-NAT-Services.html).
    short: Creates a network address translation (NAT) service in the specified public Subnet of a Net.
  CreateNet:
    use: CreateNet
    content: Net
    entity: net
    group: Net
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: IpRange
      required: true
      kind: 24
      help: '[REQUIRED] The IP range for the Net, in CIDR notation (for example, 10.0.0.0/16).'
    - name: Tenancy
      kind: 24
      help: 'The tenancy options for the VMs: - default if a VM created in a Net can be launched with any tenancy.'
    help: |-
      Creates a Net with a specified IP range.
      
      The IP range (network range) of your Net must be between a /28 netmask (16 IPs) and a /16 netmask (65536 IPs).
      
      
      For more information, see [About Nets](https://docs.outscale.com/en/userguide/About-Nets.html).
    short: Creates a Net with a specified IP range.
  CreateNetAccessPoint:
    use: CreateNetAccessPoint
    content: NetAccessPoint
    entity: netaccesspoint
    group: NetAccessPoint
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net.'
    - name: RouteTableIds
      kind: 24
      container: 23
      help: One or more IDs of route tables to use for the connection.
    - name: ServiceName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the service (in the format com.outscale.region.service).'
    help: |-
      Creates a Net access point to access an OUTSCALE service from this Net without using the Internet or public IPs.
      
      You specify the service using its name. For more information about the available services, see [ReadNetAccessPointServices](#readnetaccesspointservices).
       
      
      To control the routing of traffic between the Net and the specified service, you can specify one or more route tables. Virtual machines placed in Subnets associated with the specified route table thus use the Net access point to access the service. When you specify a route table, a route is automatically added to it with the destination set to the prefix list ID of the service, and the target set to the ID of the access point.
      
      
      When a Net access point is created, a public IP is automatically allocated to your OUTSCALE account and used for the Net access point. This public IP is not connected to the Internet. It is counted in your quota, but it is not billed.
       
      
      For more information, see [About Net Access Points](https://docs.outscale.com/en/userguide/About-Net-Access-Points.html).
    short: Creates a Net access point to access an OUTSCALE service from this Net without using the Internet or public IPs.
  CreateNetPeering:
    use: CreateNetPeering
    content: NetPeering
    entity: netpeering
    group: NetPeering
    flags:
    - name: AccepterNetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net you want to connect with.<br/ > If the Net does not belong to you, you must also specify the AccepterOwnerId parameter with the OUTSCALE account ID owning the Net you want to connect with.'
    - name: AccepterOwnerId
      kind: 24
      help: The OUTSCALE account ID of the owner of the Net you want to connect with.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: SourceNetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net you send the peering request from.'
    help: |-
      Requests a Net peering between a Net you own and a peer Net that belongs to you or another OUTSCALE account.
      
      This action creates a Net peering that remains in the `pending-acceptance` state until it is accepted by the owner of the peer Net. If the owner of the peer Net does not accept the request within 7 days, the state of the Net peering becomes `expired`. For more information, see [AcceptNetPeering](#acceptnetpeering).
      
      
      
      **[IMPORTANT]**
      
      * The two Nets must not have overlapping IP ranges. Otherwise, the Net peering is in the `failed` state.
      
      * A peering connection between two Nets works both ways. If an A-to-B connection is already created and accepted, creating a B-to-A connection is not necessary and would be automatically rejected.
      
      For more information, see [About Net Peerings](https://docs.outscale.com/en/userguide/About-Net-Peerings.html).
    short: Requests a Net peering between a Net you own and a peer Net that belongs to you or another OUTSCALE account.
  CreateNic:
    use: CreateNic
    content: Nic
    entity: nic
    group: Nic
    flags:
    - name: Description
      kind: 24
      help: A description for the NIC.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: 'PrivateIps.#.IsPrimary'
      kind: 1
      help: If true, the IP is the primary private IP of the NIC.
    - name: 'PrivateIps.#.PrivateIp'
      kind: 24
      help: A private IP for the NIC.
    - name: SecurityGroupIds
      kind: 24
      container: 23
      help: One or more IDs of security groups for the NIC.
    - name: SubnetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Subnet in which you want to create the NIC.'
    help: |-
      Creates a network interface card (NIC) in the specified Subnet.
      
      
      For more information, see [About NICs](https://docs.outscale.com/en/userguide/About-NICs.html).
    short: Creates a network interface card (NIC) in the specified Subnet.
  CreatePolicy:
    use: CreatePolicy
    content: Policy
    entity: policy
    group: Policy
    flags:
    - name: Description
      kind: 24
      help: A description for the policy.
    - name: Document
      required: true
      kind: 24
      customValue: fileOrJson
      help: Either a file storing the policy document, or the policy document (in JSON format).
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Path
      kind: 24
      help: The path of the policy.
    - name: PolicyName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the policy.'
    help: |-
      Creates a managed policy to apply to a user.
      
      This action creates a policy version and sets v1 as the default one.
    short: Creates a managed policy to apply to a user.
  CreatePolicyVersion:
    use: CreatePolicyVersion
    content: PolicyVersion
    entity: policyversion
    group: Policy
    flags:
    - name: Document
      required: true
      kind: 24
      customValue: fileOrJson
      help: Either a file storing the policy document, or the policy document (in JSON format).
    - name: PolicyOrn
      required: true
      kind: 24
      help: '[REQUIRED] The OUTSCALE Resource Name (ORN) of the policy.'
    - name: SetAsDefault
      kind: 1
      help: If set to true, the new policy version is set as the default version and becomes the operative one.
    help: |-
      Creates a version of a specified managed policy.
      
      A managed policy can have up to five versions.
      
      
      
      
      **[IMPORTANT]**
      
      A delay of up to 15 seconds can occur when attaching, detaching, or updating a managed policy.
    short: Creates a version of a specified managed policy.
  CreateProductType:
    use: CreateProductType
    content: ProductType
    entity: producttype
    group: ProductType
    flags:
    - name: Description
      required: true
      kind: 24
      help: '[REQUIRED] The description of the product type.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Vendor
      kind: 24
      help: The vendor of the product type.
    help: Creates a product type you can associate with an OMI for consumption monitoring and billing purposes.
    short: Creates a product type you can associate with an OMI for consumption monitoring and billing purposes.
  CreatePublicIp:
    use: CreatePublicIp
    content: PublicIp
    entity: publicip
    group: PublicIp
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: |-
      Acquires a public IP for your account.
      
      A public IP is a static IP designed for dynamic Cloud computing. It can be associated with a virtual machine (VM) in the public Cloud, a VM in a Net, a network interface card (NIC), or a NAT service.
      
      
      For more information, see [About Public IPs](https://docs.outscale.com/en/userguide/About-Public-IPs.html).
    short: Acquires a public IP for your account.
  CreateRoute:
    use: CreateRoute
    content: RouteTable
    entity: route
    group: Route
    flags:
    - name: DestinationIpRange
      required: true
      kind: 24
      help: '[REQUIRED] The IP range used for the destination match, in CIDR notation (for example, 10.0.0.0/24).'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: GatewayId
      kind: 24
      help: The ID of an internet service or virtual gateway attached to your Net.
    - name: NatServiceId
      kind: 24
      help: The ID of a NAT service.
    - name: NetPeeringId
      kind: 24
      help: The ID of a Net peering.
    - name: NicId
      kind: 24
      help: The ID of a NIC.
    - name: RouteTableId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the route table for which you want to create a route.'
    - name: VmId
      kind: 24
      help: The ID of a NAT VM in your Net (attached to exactly one NIC).
    help: |-
      Creates a route in a specified route table within a specified Net.
      
      You must specify one of the following elements as the target:
      
      
      
      * Net peering
      
      * NAT VM
      
      * Internet service
      
      * Virtual gateway
      
      * NAT service
      
      * Network interface card (NIC)
      
      
      
      The routing algorithm is based on the most specific match.
      
      
      For more information, see [About Route Tables](https://docs.outscale.com/en/userguide/About-Route-Tables.html).
    short: Creates a route in a specified route table within a specified Net.
  CreateRouteTable:
    use: CreateRouteTable
    content: RouteTable
    entity: routetable
    group: RouteTable
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net for which you want to create a route table.'
    help: |-
      Creates a route table for a specified Net.
      
      You can then add routes and associate this route table with a Subnet.
      
      
      For more information, see [About Route Tables](https://docs.outscale.com/en/userguide/About-Route-Tables.html).
    short: Creates a route table for a specified Net.
  CreateSecurityGroup:
    use: CreateSecurityGroup
    content: SecurityGroup
    entity: securitygroup
    group: SecurityGroup
    flags:
    - name: Description
      required: true
      kind: 24
      help: '[REQUIRED] A description for the security group.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NetId
      kind: 24
      help: The ID of the Net for the security group.
    - name: SecurityGroupName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the security group.'
    help: |-
      Creates a security group.
      
      This action creates a security group either in the public Cloud or in a specified Net. By default, a default security group for use in the public Cloud and a default security group for use in a Net are created.
      
      When launching a virtual machine (VM), if no security group is explicitly specified, the appropriate default security group is assigned to the VM. Default security groups include a default rule granting VMs network access to each other.
      
      When creating a security group, you specify a name. Two security groups for use in the public Cloud or for use in a Net cannot have the same name.
      
      You can have up to 500 security groups in the public Cloud. You can create up to 500 security groups per Net.
      
      To add or remove rules, use the [CreateSecurityGroupRule](#createsecuritygrouprule) method.
      
      
      For more information, see [About Security Groups](https://docs.outscale.com/en/userguide/About-Security-Groups.html).
    short: Creates a security group.
  CreateSecurityGroupRule:
    use: CreateSecurityGroupRule
    content: SecurityGroup
    entity: securitygrouprule
    group: SecurityGroupRule
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Flow
      required: true
      kind: 24
      help: '[REQUIRED] The direction of the flow: Inbound or Outbound.'
    - name: FromPortRange
      kind: 2
      help: The beginning of the port range for the TCP and UDP protocols, or an ICMP type number.
    - name: IpProtocol
      kind: 24
      help: The IP protocol name (tcp, udp, icmp, or -1 for all protocols).
    - name: IpRange
      kind: 24
      help: The IP range for the security group rule, in CIDR notation (for example, 10.0.0.0/16).
    - name: 'Rules.#.FromPortRange'
      kind: 2
      help: The beginning of the port range for the TCP and UDP protocols, or an ICMP type number.
    - name: 'Rules.#.IpProtocol'
      kind: 24
      help: The IP protocol name (tcp, udp, icmp, or -1 for all protocols).
    - name: 'Rules.#.IpRanges'
      kind: 24
      container: 23
      help: One or more IP ranges for the security group rules, in CIDR notation (for example, ["10.0.0.0/24" , "10.0.1.0/24"]).
    - name: 'Rules.#.SecurityGroupRuleId'
      kind: 24
      help: The ID of the security group rule.
    - name: 'Rules.#.SecurityGroupsMembers.#.AccountId'
      kind: 24
      help: The OUTSCALE account ID that owns the source or destination security group.
    - name: 'Rules.#.SecurityGroupsMembers.#.SecurityGroupId'
      kind: 24
      help: The ID of a source or destination security group that you want to link to the security group of the rule.
    - name: 'Rules.#.SecurityGroupsMembers.#.SecurityGroupName'
      kind: 24
      help: The name of a source or destination security group that you want to link to the security group of the rule.
    - name: 'Rules.#.ServiceIds'
      kind: 24
      container: 23
      help: One or more service IDs to allow traffic from a Net to access the corresponding OUTSCALE services.
    - name: 'Rules.#.ToPortRange'
      kind: 2
      help: The end of the port range for the TCP and UDP protocols, or an ICMP code number.
    - name: SecurityGroupAccountIdToLink
      kind: 24
      help: The OUTSCALE account ID that owns the source or destination security group specified in the SecurityGroupNameToLink parameter.
    - name: SecurityGroupId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the security group for which you want to create a rule.'
    - name: SecurityGroupNameToLink
      kind: 24
      help: The ID of a source or destination security group that you want to link to the security group of the rule.
    - name: ToPortRange
      kind: 2
      help: The end of the port range for the TCP and UDP protocols, or an ICMP code number.
    help: |-
      Adds one or more rules to a security group.
      
      Use the `SecurityGroupId` parameter to specify the security group for which you want to create a rule.
      
      Use the `Flow` parameter to specify if you want an inbound rule or an outbound rule.
      
      
      An inbound rule allows the security group to receive traffic:
      * Either from a specific IP range (`IpRange` parameter) on a specific port range (`FromPortRange` and `ToPortRange` parameters) and specific protocol (`IpProtocol` parameter).
      * Or from another specific security group (`SecurityGroupAccountIdToLink` and `SecurityGroupNameToLink` parameters).
      
      
      (Net only) An outbound rule works similarly but allows the security group to send traffic rather than receive traffic.
      
      
      Alternatively, you can use the `Rules` parameter to add several rules at the same time. Note that the `SecurityGroupName` subparameter can only be used for security groups in the public Cloud.
      
      **[NOTE]**
      
      * The modifications are effective as quickly as possible, but a small delay may occur.
      
      * By default, traffic between two security groups is allowed through both public and private IPs. To restrict traffic to private IPs only, contact our Support team at support@outscale.com.
      
      For more information, see [About Security Group Rules](https://docs.outscale.com/en/userguide/About-Security-Group-Rules.html).
    short: Adds one or more rules to a security group.
  CreateServerCertificate:
    use: CreateServerCertificate
    content: ServerCertificate
    entity: servercertificate
    group: ServerCertificate
    flags:
    - name: Body
      required: true
      kind: 24
      help: '[REQUIRED] The PEM-encoded X509 certificate.'
    - name: Chain
      kind: 24
      help: The PEM-encoded intermediate certification authorities.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Name
      required: true
      kind: 24
      help: '[REQUIRED] A unique name for the certificate.'
    - name: Path
      kind: 24
      help: The path to the server certificate, set to a slash (/) if not specified.
    - name: PrivateKey
      required: true
      kind: 24
      help: '[REQUIRED] The PEM-encoded private key matching the certificate.'
    help: |-
      Creates a server certificate and its matching private key.
      
      
      These elements can be used with other services (for example, to configure SSL termination on load balancers).
      
      
      You can also specify the chain of intermediate certification authorities if your certificate is not directly signed by a root one. You can specify multiple intermediate certification authorities in the `CertificateChain` parameter. To do so, concatenate all certificates in the correct order (the first certificate must be the authority of your certificate, the second must be the authority of the first one, and so on).
      
      
      The private key must be a RSA key in PKCS1 form. To check this, open the PEM file and ensure its header reads as follows: BEGIN RSA PRIVATE KEY.
      
      
      [IMPORTANT]
      
      
      This private key must not be protected by a password or a passphrase.
      
      
      For more information, see [About Server Certificates in EIM](https://docs.outscale.com/en/userguide/About-Server-Certificates-in-EIM.html).
    short: Creates a server certificate and its matching private key.
  CreateSnapshot:
    use: CreateSnapshot
    content: Snapshot
    entity: snapshot
    group: Snapshot
    flags:
    - name: ClientToken
      kind: 24
      help: A unique identifier which enables you to manage the idempotency.
    - name: Description
      kind: 24
      help: A description for the snapshot.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: FileLocation
      kind: 24
      help: '**(when importing from a bucket)** The pre-signed URL of the snapshot you want to import.'
    - name: SnapshotSize
      kind: 6
      help: '**(when importing from a bucket)** The size of the snapshot you want to create in your account, in bytes.'
    - name: SourceRegionName
      kind: 24
      help: '**(when copying a snapshot)** The name of the source Region, which must be the same as the Region of your account.'
    - name: SourceSnapshotId
      kind: 24
      help: '**(when copying a snapshot)** The ID of the snapshot you want to copy.'
    - name: VolumeId
      kind: 24
      help: '**(when creating from a volume)** The ID of the volume you want to create a snapshot of.'
    help: |-
      Creates a snapshot. Snapshots are point-in-time images of a volume that you can use to back up your data or to create replicas of this volume.
      
      You can use this method in three different ways:
      * **Creating from a volume**: You create a snapshot from one of your volumes.
      
      * **Copying a snapshot**: You copy an existing snapshot. The source snapshot can be one of your own snapshots, or a snapshot owned by another OUTSCALE account that has granted you permission via the [UpdateSnapshot](#updatesnapshot) method.
      
      * **Importing from a bucket**: You import a snapshot located in an OUTSCALE Object Storage (OOS) bucket. First, the owner of the source snapshot must export it to a bucket by using the [CreateSnapshotExportTask](#createsnapshotexporttask) method. Then, they must grant you permission to read the snapshot via a pre-signed URL. For more information, see [Creating a Pre-Signed URL](https://docs.outscale.com/en/userguide/Creating-a-Pre-Signed-URL.html).
      
      **[NOTE]**
      
      In case of excessive use of the snapshot creation feature on the same volume over a short period of time, 3DS OUTSCALE reserves the right to temporarily block the feature.
      
      For more information, see [About Snapshots](https://docs.outscale.com/en/userguide/About-Snapshots.html).
    short: Creates a snapshot.
  CreateSnapshotExportTask:
    use: CreateSnapshotExportTask
    content: SnapshotExportTask
    entity: snapshotexporttask
    group: Snapshot
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: OsuExport.DiskImageFormat
      required: true
      kind: 24
      help: '[REQUIRED] The format of the export disk (qcow2 | raw).'
    - name: OsuExport.OsuApiKey.ApiKeyId
      kind: 24
      help: The API key of the OOS account that enables you to access the bucket.
    - name: OsuExport.OsuApiKey.SecretKey
      kind: 24
      help: The secret key of the OOS account that enables you to access the bucket.
    - name: OsuExport.OsuBucket
      required: true
      kind: 24
      help: '[REQUIRED] The name of the OOS bucket where you want to export the object.'
    - name: OsuExport.OsuManifestUrl
      kind: 24
      help: The URL of the manifest file.
    - name: OsuExport.OsuPrefix
      kind: 24
      help: The prefix for the key of the OOS object.
    - name: SnapshotId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the snapshot to export.'
    help: |-
      Exports a snapshot to an OUTSCALE Object Storage (OOS) bucket that belongs to you. This action enables you to create a backup of your snapshot.
      
      
      You can share this snapshot with others OUTSCALE accounts by granting permission to read it via pre-signed URLs. For more information, see [Creating a Pre-Signed URL](https://docs.outscale.com/en/userguide/Creating-a-Pre-Signed-URL.html).
      
      
      **[IMPORTANT]**
      
      Export tasks can only be canceled while in the `pending/queued` state.
      
      
      For more information, see [About Snapshots](https://docs.outscale.com/en/userguide/About-Snapshots.html).
    short: Exports a snapshot to an OUTSCALE Object Storage (OOS) bucket that belongs to you.
  CreateSubnet:
    use: CreateSubnet
    content: Subnet
    entity: subnet
    group: Subnet
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: IpRange
      required: true
      kind: 24
      help: '[REQUIRED] The IP range in the Subnet, in CIDR notation (for example, 10.0.0.0/16).'
    - name: NetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net for which you want to create a Subnet.'
    - name: SubregionName
      kind: 24
      help: The name of the Subregion in which you want to create the Subnet.
    help: |-
      Creates a Subnet in an existing Net.
      
      To create a Subnet in a Net, you have to provide the ID of the Net and the IP range for the Subnet (its network range). Once the Subnet is created, you cannot modify its IP range.
      
      
      For more information, see [About Nets](https://docs.outscale.com/en/userguide/About-Nets.html).
    short: Creates a Subnet in an existing Net.
  CreateTags:
    use: CreateTags
    entity: tag
    group: Tag
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: ResourceIds
      kind: 24
      container: 23
      help: One or more resource IDs.
    - name: 'Tags.#.Key'
      kind: 24
      help: The key of the tag, between 1 and 255 characters.
    - name: 'Tags.#.Value'
      kind: 24
      help: The value of the tag, between 0 and 255 characters.
    help: |-
      Adds one or more tags to the specified resources.
      
      If a tag with the same key already exists for the resource, the tag value is replaced.
      
      You can tag the following resources using their IDs:
      
      
      
      * Client gateways (cgw-xxxxxxxx)
      
      * DHCP options (dopt-xxxxxxxx)
      
      * Flexible GPU (fgpu-xxxxxxxx)
      
      * Images (ami-xxxxxxxx)
      
      * Internet services (igw-xxxxxxxx)
      
      * Keypairs (key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx)
      
      * NAT services (nat-xxxxxxxx)
      
      * Net endpoints (vpce-xxxxxxxx)
      
      * Net peerings (vpcx-xxxxxxxx)
      
      * Nets (vpc-xxxxxxxx)
      
      * Network interface cards (NIC) (eni-xxxxxxxx)
      
      * OMI export tasks (image-export-xxxxxxxx)
      
      * Public IPs (eipalloc-xxxxxxxx)
      
      * Route tables (rtb-xxxxxxxx)
      
      * Security groups (sg-xxxxxxxx)
      
      * Snapshot export tasks (snap-export-xxxxxxxx)
      * Snapshots (snap-xxxxxxxx)
      
      * Subnets (subnet-xxxxxxxx)
      
      * Virtual gateways (vgw-xxxxxxxx)
      
      * Virtual machines (VMs) (i-xxxxxxxx)
      
      * Volumes (vol-xxxxxxxx)
      
      * VPN connections (vpn-xxxxxxxx)
      
      
      For more information, see [About Tags](https://docs.outscale.com/en/userguide/About-Tags.html).
    short: Adds one or more tags to the specified resources.
  CreateUser:
    use: CreateUser
    content: User
    entity: user
    group: User
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Path
      kind: 24
      help: The path to the EIM user you want to create (by default, /).
    - name: UserEmail
      kind: 24
      help: The email address of the EIM user.
    - name: UserName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the EIM user.'
    help: |-
      Creates an EIM user for your OUTSCALE account.
      
      
      For more information, see [About EIM Users](https://docs.outscale.com/en/userguide/About-EIM-Users.html).
    short: Creates an EIM user for your OUTSCALE account.
  CreateUserGroup:
    use: CreateUserGroup
    content: UserGroup
    entity: usergroup
    group: UserGroup
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Path
      kind: 24
      help: The path to the group.
    - name: UserGroupName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the group.'
    help: |-
      Creates a group to which you can add users.
      
      You can also add an inline policy or link a managed policy to the group, which is applied to all its users.
    short: Creates a group to which you can add users.
  CreateVirtualGateway:
    use: CreateVirtualGateway
    content: VirtualGateway
    entity: virtualgateway
    group: VirtualGateway
    flags:
    - name: ConnectionType
      required: true
      kind: 24
      help: '[REQUIRED] The type of VPN connection supported by the virtual gateway (always ipsec.1).'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: |-
      Creates a virtual gateway.
      
      A virtual gateway is the access point on the Net side of a VPN connection.
      
      
      For more information, see [About Virtual Gateways](https://docs.outscale.com/en/userguide/About-Virtual-Gateways.html).
    short: Creates a virtual gateway.
  CreateVmGroup:
    use: CreateVmGroup
    content: VmGroup
    entity: vmgroup
    group: VmGroup
    flags:
    - name: Description
      kind: 24
      help: A description for the VM group.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PositioningStrategy
      kind: 24
      help: The positioning strategy of VMs on hypervisors.
      values:
      - attract
      - no-strategy
      - repulse
    - name: SecurityGroupIds
      kind: 24
      container: 23
      help: One or more IDs of security groups for the VM group.
    - name: SubnetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Subnet in which you want to create the VM group.'
    - name: 'Tags.#.Key'
      kind: 24
      help: The key of the tag, between 1 and 255 characters.
    - name: 'Tags.#.Value'
      kind: 24
      help: The value of the tag, between 0 and 255 characters.
    - name: VmCount
      required: true
      kind: 2
      help: '[REQUIRED] The number of VMs deployed in the VM group.'
    - name: VmGroupName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the VM group.'
    - name: VmTemplateId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the VM template used to launch VMs in the VM group.'
    help: |-
      > [WARNING]
      
      > This feature is currently under development and may not function properly.
      
      
      Creates a group of virtual machines (VMs) containing the same characteristics as a specified VM template, and then launches them.
      
      You can create up to 100 VM groups in your OUTSCALE account.
    short: '> [WARNING] > This feature is currently under development and may not function properly.'
  CreateVmTemplate:
    use: CreateVmTemplate
    content: VmTemplate
    entity: vmtemplate
    group: VmTemplate
    flags:
    - name: CpuCores
      required: true
      kind: 2
      help: '[REQUIRED] The number of vCores to use for each VM.'
    - name: CpuGeneration
      required: true
      kind: 24
      help: '[REQUIRED] The processor generation to use for each VM (for example, v4).'
    - name: CpuPerformance
      kind: 24
      help: The performance of the VMs.
      values:
      - high
      - highest
      - medium
    - name: Description
      kind: 24
      help: A description for the VM template.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: ImageId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the OMI to use for each VM.'
    - name: KeypairName
      kind: 24
      help: The name of the keypair to use for each VM.
    - name: Ram
      required: true
      kind: 2
      help: '[REQUIRED] The amount of RAM to use for each VM.'
    - name: 'Tags.#.Key'
      kind: 24
      help: The key of the tag, between 1 and 255 characters.
    - name: 'Tags.#.Value'
      kind: 24
      help: The value of the tag, between 0 and 255 characters.
    - name: VmTemplateName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the VM template.'
    help: |-
      > [WARNING]
      
      > This feature is currently under development and may not function properly.
      
      
      Creates a virtual machine (VM) template. You can then use the VM template to create VM groups.
      
      You can create up to 50 VM templates in your OUTSCALE account.
    short: '> [WARNING] > This feature is currently under development and may not function properly.'
  CreateVms:
    use: CreateVms
    content: Vms
    entity: vm
    group: Vm
    flags:
    - name: ActionsOnNextBoot.SecureBoot
      kind: 24
      help: One action to perform on the next boot of the VM (enable | disable | setup-mode | none).
      values:
      - disable
      - enable
      - none
      - restore-factory-keys
      - setup-mode
    - name: 'BlockDeviceMappings.#.Bsu.DeleteOnVmDeletion'
      kind: 1
      help: If set to true, the volume is deleted when terminating the VM.
    - name: 'BlockDeviceMappings.#.Bsu.Iops'
      kind: 2
      help: The number of I/O operations per second (IOPS).
    - name: 'BlockDeviceMappings.#.Bsu.SnapshotId'
      kind: 24
      help: The ID of the snapshot used to create the volume.
    - name: 'BlockDeviceMappings.#.Bsu.VolumeSize'
      kind: 2
      help: The size of the volume, in gibibytes (GiB).
    - name: 'BlockDeviceMappings.#.Bsu.VolumeType'
      kind: 24
      help: The type of the volume (standard | io1 | gp2).
      values:
      - gp2
      - io1
      - standard
    - name: 'BlockDeviceMappings.#.DeviceName'
      kind: 24
      help: The device name for the volume.
    - name: 'BlockDeviceMappings.#.NoDevice'
      kind: 24
      help: Removes the device which is included in the block device mapping of the OMI.
    - name: 'BlockDeviceMappings.#.VirtualDeviceName'
      kind: 24
      help: The name of the virtual device (ephemeralN).
    - name: BootMode
      kind: 24
      help: Information about the boot mode of the VM.
      values:
      - legacy
      - uefi
    - name: BootOnCreation
      kind: 1
      help: If true, the VM is started on creation.
    - name: BsuOptimized
      kind: 1
      help: This parameter is not available.
    - name: ClientToken
      kind: 24
      help: A unique identifier which enables you to manage the idempotency.
    - name: DeletionProtection
      kind: 1
      help: If true, you cannot delete the VM unless you change this parameter back to false.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: ImageId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the OMI used to create the VM.'
    - name: KeypairName
      kind: 24
      help: The name of the keypair.
    - name: MaxVmsCount
      kind: 2
      help: The maximum number of VMs you want to create.
    - name: MinVmsCount
      kind: 2
      help: The minimum number of VMs you want to create.
    - name: NestedVirtualization
      kind: 1
      help: (dedicated tenancy only) If true, nested virtualization is enabled.
    - name: 'Nics.#.DeleteOnVmDeletion'
      kind: 1
      help: If true, the NIC is deleted when the VM is terminated.
    - name: 'Nics.#.Description'
      kind: 24
      help: The description of the NIC, if you are creating a NIC when creating the VM.
    - name: 'Nics.#.DeviceNumber'
      kind: 2
      help: The index of the VM device for the NIC attachment (between 0 and 7, both included).
    - name: 'Nics.#.NicId'
      kind: 24
      help: The ID of the NIC, if you are attaching an existing NIC when creating a VM.
    - name: 'Nics.#.PrivateIps.#.IsPrimary'
      kind: 1
      help: If true, the IP is the primary private IP of the NIC.
    - name: 'Nics.#.PrivateIps.#.PrivateIp'
      kind: 24
      help: A private IP for the NIC.
    - name: 'Nics.#.SecondaryPrivateIpCount'
      kind: 2
      help: The number of secondary private IPs, if you create a NIC when creating a VM.
    - name: 'Nics.#.SecurityGroupIds'
      kind: 24
      container: 23
      help: One or more IDs of security groups for the NIC, if you create a NIC when creating a VM.
    - name: 'Nics.#.SubnetId'
      kind: 24
      help: The ID of the Subnet for the NIC, if you create a NIC when creating a VM.
    - name: Performance
      kind: 24
      help: The performance of the VM.
      values:
      - high
      - highest
      - medium
    - name: Placement.SubregionName
      kind: 24
      help: The name of the Subregion.
    - name: Placement.Tenancy
      kind: 24
      help: The tenancy of the VM (default, dedicated, or a dedicated group ID).
    - name: PrivateIps
      kind: 24
      container: 23
      help: One or more private IPs of the VM.
    - name: SecurityGroupIds
      kind: 24
      container: 23
      help: One or more IDs of security group for the VMs.
    - name: SecurityGroups
      kind: 24
      container: 23
      help: One or more names of security groups for the VMs.
    - name: ShutdownBehaviorConfiguration.GuestAction
      kind: 24
      help: The action performed by the orchestrator when the VM is shut down from the guest operating system.
      values:
      - stop
      - terminate
    - name: ShutdownBehaviorConfiguration.HostAction
      kind: 24
      help: The action performed by the orchestrator when the VM is shut down due to a host infrastructure failure.
      values:
      - restart
      - stop
    - name: SubnetId
      kind: 24
      help: The ID of the Subnet in which you want to create the VM.
    - name: TpmEnabled
      kind: 1
      help: If true, a virtual Trusted Platform Module (vTPM) is enabled on the VM.
    - name: UserData
      kind: 24
      customValue: base64File
      help: The file storing the data or script used to add a specific configuration to the VM (max size 500 KiB).
    - name: VmInitiatedShutdownBehavior
      kind: 24
      help: The VM behavior when you stop it.
    - name: VmType
      kind: 24
      help: The type of VM.
    help: |-
      Creates virtual machines (VMs), and then launches them.
      
      This action enables you to create a specified number of VMs using an OUTSCALE machine image (OMI) that you are allowed to use, and then to automatically launch them.
      
      The VMs remain in the `pending` state until they are created and ready to be used. Once automatically launched, they are in the `running` state.
      
      To check the state of your VMs, call the [ReadVms](#readvms) method.
      
      The metadata server enables you to get the public key provided when the VM is launched. Official OMIs contain a script to get this public key and put it inside the VM to provide secure access without password.
      
      If not specified, the security group used by the service is the default one.
      
      
      **[NOTE]**
      
      When you attach a security group to a VM, it is actually attached to the primary network interface of the VM.
      
      
      For more information, see [About VMs](https://docs.outscale.com/en/userguide/About-VMs.html).
    short: Creates virtual machines (VMs), and then launches them.
  CreateVolume:
    use: CreateVolume
    content: Volume
    entity: volume
    group: Volume
    flags:
    - name: ClientToken
      kind: 24
      help: A unique identifier which enables you to manage the idempotency.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Iops
      kind: 2
      help: The number of I/O operations per second (IOPS).
    - name: Size
      kind: 2
      help: The size of the volume, in gibibytes (GiB).
    - name: SnapshotId
      kind: 24
      help: The ID of the snapshot from which you want to create the volume.
    - name: SubregionName
      required: true
      kind: 24
      help: '[REQUIRED] The Subregion in which you want to create the volume.'
    - name: VolumeType
      kind: 24
      help: The type of volume you want to create (io1 | gp2 | standard).
      values:
      - gp2
      - io1
      - standard
    help: |-
      Creates a Block Storage Unit (BSU) volume in a specified Region.
      
      BSU volumes can be attached to a virtual machine (VM) in the same Subregion. You can create an empty volume or restore a volume from an existing snapshot.
      
      You can create the following volume types: Enterprise (`io1`) for provisioned IOPS SSD volumes, Performance (`gp2`) for general purpose SSD volumes, or Magnetic (`standard`) volumes.
      
      
      For more information, see [About Volumes](https://docs.outscale.com/en/userguide/About-Volumes.html).
    short: Creates a Block Storage Unit (BSU) volume in a specified Region.
  CreateVpnConnection:
    use: CreateVpnConnection
    content: VpnConnection
    entity: vpnconnection
    group: VpnConnection
    flags:
    - name: ClientGatewayId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the client gateway.'
    - name: ConnectionType
      required: true
      kind: 24
      help: '[REQUIRED] The type of VPN connection (always ipsec.1).'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: StaticRoutesOnly
      kind: 1
      help: By default or if false, the VPN connection uses dynamic routing with Border Gateway Protocol (BGP).
    - name: VirtualGatewayId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the virtual gateway.'
    help: |-
      Creates a VPN connection between a specified virtual gateway and a specified client gateway.
      
      You can create only one VPN connection between a virtual gateway and a client gateway.
      
      
      
      **[IMPORTANT]**
      
      This action can be done only if the virtual gateway is in the `available` state.
      
      
      For more information, see [About VPN Connections](https://docs.outscale.com/en/userguide/About-VPN-Connections.html).
    short: Creates a VPN connection between a specified virtual gateway and a specified client gateway.
  CreateVpnConnectionRoute:
    use: CreateVpnConnectionRoute
    entity: vpnconnectionroute
    group: VpnConnection
    flags:
    - name: DestinationIpRange
      required: true
      kind: 24
      help: '[REQUIRED] The network prefix of the route, in CIDR notation (for example, 10.12.0.0/16).'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: VpnConnectionId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the target VPN connection of the static route.'
    help: |-
      Creates a static route to a VPN connection.
      
      This enables you to select the network flows sent by the virtual gateway to the target VPN connection.
      
      
      For more information, see [About Routing Configuration for VPN Connections](https://docs.outscale.com/en/userguide/About-Routing-Configuration-for-VPN-Connections.html).
    short: Creates a static route to a VPN connection.
  DeleteAccessKey:
    use: DeleteAccessKey
    entity: accesskey
    group: AccessKey
    flags:
    - name: AccessKeyId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the access key you want to delete.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: UserName
      kind: 24
      help: The name of the EIM user the access key you want to delete is associated with.
    help: |-
      Deletes the specified access key of either the root user or an EIM user.
      
      
      The access key of an EIM user must be in the `INACTIVE` state to be deleted.
    short: Deletes the specified access key of either the root user or an EIM user.
  DeleteApiAccessRule:
    use: DeleteApiAccessRule
    entity: apiaccessrule
    group: ApiAccessRule
    flags:
    - name: ApiAccessRuleId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the API access rule you want to delete.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: |-
      Deletes a specified API access rule.
      
      
      
      **[IMPORTANT]**
      
      You cannot delete the last remaining API access rule. However, if you delete all the API access rules that allow you to access the APIs, you need to contact the Support team to regain access. For more information, see [Technical Support](https://docs.outscale.com/en/userguide/Technical-Support.html).
    short: Deletes a specified API access rule.
  DeleteCa:
    use: DeleteCa
    entity: ca
    group: Ca
    flags:
    - name: CaId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the CA you want to delete.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: Deletes a specified Client Certificate Authority (CA).
    short: Deletes a specified Client Certificate Authority (CA).
  DeleteClientGateway:
    use: DeleteClientGateway
    entity: clientgateway
    group: ClientGateway
    flags:
    - name: ClientGatewayId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the client gateway you want to delete.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: |-
      Deletes a client gateway.
      
      You must delete the VPN connection before deleting the client gateway.
    short: Deletes a client gateway.
  DeleteDedicatedGroup:
    use: DeleteDedicatedGroup
    entity: dedicatedgroup
    group: DedicatedGroup
    flags:
    - name: DedicatedGroupId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the dedicated group you want to delete.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Force
      kind: 1
      help: If true, forces the deletion of the dedicated group and all its dependencies.
    help: |-
      Deletes a specified dedicated group of virtual machines (VMs).
      
      
      **[WARNING]**
      
      A dedicated group can be deleted only if no VM or Net is in the dedicated group. Otherwise, you need to force the deletion.
      
      If you force the deletion:
      
      - all VMs are terminated.
      
      - all Nets are deleted, and all resources associated with Nets are detached.
    short: Deletes a specified dedicated group of virtual machines (VMs).
  DeleteDhcpOptions:
    use: DeleteDhcpOptions
    entity: dhcpoption
    group: DhcpOption
    flags:
    - name: DhcpOptionsSetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the DHCP options set you want to delete.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: |-
      Deletes a specified DHCP options set.
      
      Before deleting a DHCP options set, you must disassociate it from the Nets you associated it with. To do so, you need to associate with each Net a new set of DHCP options, or the `default` one if you do not want to associate any DHCP options with the Net.
      
      
      
      **[IMPORTANT]**
      
      You cannot delete the `default` set.
    short: Deletes a specified DHCP options set.
  DeleteDirectLink:
    use: DeleteDirectLink
    entity: directlink
    group: DirectLink
    flags:
    - name: DirectLinkId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the DirectLink you want to delete.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: |-
      Deletes a specified DirectLink.
      
      Before deleting a DirectLink, ensure that all your DirectLink interfaces related to this DirectLink are deleted.
    short: Deletes a specified DirectLink.
  DeleteDirectLinkInterface:
    use: DeleteDirectLinkInterface
    entity: directlinkinterface
    group: DirectLinkInterface
    flags:
    - name: DirectLinkInterfaceId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the DirectLink interface you want to delete.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: Deletes a specified DirectLink interface.
    short: Deletes a specified DirectLink interface.
  DeleteExportTask:
    use: DeleteExportTask
    entity: exporttask
    group: Task
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: ExportTaskId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the export task to delete.'
    help: |-
      Deletes an export task.
      
      If the export task is not in the `active` or `pending` state, the command fails and an error is returned.
    short: Deletes an export task.
  DeleteFlexibleGpu:
    use: DeleteFlexibleGpu
    entity: flexiblegpu
    group: FlexibleGpu
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: FlexibleGpuId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the fGPU you want to delete.'
    help: |-
      Releases a flexible GPU (fGPU) from your OUTSCALE account.
      
      The fGPU becomes free to be used by someone else.
    short: Releases a flexible GPU (fGPU) from your OUTSCALE account.
  DeleteImage:
    use: DeleteImage
    entity: image
    group: Image
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: ImageId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the OMI you want to delete.'
    help: Deletes an OUTSCALE machine image (OMI) so that you cannot use it anymore to launch virtual machines (VMs). However, you can still use VMs already launched from this OMI.
    short: Deletes an OUTSCALE machine image (OMI) so that you cannot use it anymore to launch virtual machines (VMs).
  DeleteInternetService:
    use: DeleteInternetService
    entity: internetservice
    group: InternetService
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: InternetServiceId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the internet service you want to delete.'
    help: |-
      Deletes an internet service.
      
      Before deleting an internet service, you must detach it from any Net it is attached to.
    short: Deletes an internet service.
  DeleteKeypair:
    use: DeleteKeypair
    entity: keypair
    group: Keypair
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: KeypairId
      kind: 24
      help: The ID of the keypair you want to delete.
    - name: KeypairName
      kind: 24
      help: The name of the keypair you want to delete.
    help: |-
      Deletes the specified keypair.
      
      This action deletes the public key stored by 3DS OUTSCALE, thus deleting the keypair.
    short: Deletes the specified keypair.
  DeleteListenerRule:
    use: DeleteListenerRule
    entity: listenerrule
    group: Listener
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: ListenerRuleName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the rule you want to delete.'
    help: |-
      Deletes a listener rule.
      
      The previously active rule is disabled after deletion.
    short: Deletes a listener rule.
  DeleteLoadBalancer:
    use: DeleteLoadBalancer
    content: LoadBalancer
    entity: loadbalancer
    group: LoadBalancer
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: LoadBalancerName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the load balancer you want to delete.'
    help: Deletes a specified load balancer.
    short: Deletes a specified load balancer.
  DeleteLoadBalancerListeners:
    use: DeleteLoadBalancerListeners
    content: LoadBalancer
    entity: loadbalancerlistener
    group: Listener
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: LoadBalancerName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the load balancer for which you want to delete listeners.'
    - name: LoadBalancerPorts
      kind: 2
      container: 23
      help: One or more port numbers of the listeners you want to delete.
    help: Deletes listeners of a specified load balancer.
    short: Deletes listeners of a specified load balancer.
  DeleteLoadBalancerPolicy:
    use: DeleteLoadBalancerPolicy
    content: LoadBalancer
    entity: loadbalancerpolicy
    group: LoadBalancerPolicy
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: LoadBalancerName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the load balancer for which you want to delete a policy.'
    - name: PolicyName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the policy you want to delete.'
    help: |-
      Deletes a specified policy from a load balancer.
      
      In order to be deleted, the policy must not be enabled for any listener.
    short: Deletes a specified policy from a load balancer.
  DeleteLoadBalancerTags:
    use: DeleteLoadBalancerTags
    entity: loadbalancertag
    group: LoadBalancer
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: LoadBalancerNames
      kind: 24
      container: 23
      help: One or more load balancer names.
    - name: 'Tags.#.Key'
      kind: 24
      help: The key of the tag, between 1 and 128 characters.
    help: Deletes one or more tags from the specified load balancers.
    short: Deletes one or more tags from the specified load balancers.
  DeleteNatService:
    use: DeleteNatService
    entity: natservice
    group: NatService
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NatServiceId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the NAT service you want to delete.'
    help: |-
      Deletes a specified network address translation (NAT) service.
      
      This action disassociates the public IP from the NAT service, but does not release this public IP from your OUTSCALE account. However, it does not delete any NAT service routes in your route tables.
    short: Deletes a specified network address translation (NAT) service.
  DeleteNet:
    use: DeleteNet
    entity: net
    group: Net
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net you want to delete.'
    help: |-
      Deletes a specified Net.
      
      Before deleting the Net, you need to delete or detach all the resources associated with the Net:
      
      
      
      * Virtual machines (VMs)
      
      * Net peerings
      
      * Custom route tables
      
      * Public IPs allocated to resources in the Net
      
      * Network Interface Cards (NICs) created in the Subnets
      
      * Virtual gateways, internet services and NAT services
      
      * Load balancers
      
      * Security groups
      
      * Subnets
    short: Deletes a specified Net.
  DeleteNetAccessPoint:
    use: DeleteNetAccessPoint
    entity: netaccesspoint
    group: NetAccessPoint
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NetAccessPointId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net access point.'
    help: |-
      Deletes a specified Net access point.
      
      This action also deletes the corresponding routes added to the route tables you specified for the Net access point.
    short: Deletes a specified Net access point.
  DeleteNetPeering:
    use: DeleteNetPeering
    entity: netpeering
    group: NetPeering
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NetPeeringId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net peering you want to delete.'
    help: |-
      Deletes a Net peering.
      
      If the Net peering is in the `active` state, it can be deleted either by the owner of the requester Net or the owner of the peer Net.
      
      If it is in the `pending-acceptance` state, it can be deleted only by the owner of the requester Net.
      
      If it is in the `rejected`, `failed`, or `expired` states, it cannot be deleted.
    short: Deletes a Net peering.
  DeleteNic:
    use: DeleteNic
    entity: nic
    group: Nic
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NicId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the NIC you want to delete.'
    help: |-
      Deletes the specified network interface card (NIC).
      
      The network interface must not be attached to any virtual machine (VM).
    short: Deletes the specified network interface card (NIC).
  DeletePolicy:
    use: DeletePolicy
    entity: policy
    group: Policy
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PolicyOrn
      required: true
      kind: 24
      help: '[REQUIRED] The OUTSCALE Resource Name (ORN) of the policy you want to delete.'
    help: |-
      Deletes a managed policy.
      
      Before deleting a managed policy, you must unlink all users linked to it and delete all the versions of the policy, except the default one, using the `DeletePolicyVersion` method.
    short: Deletes a managed policy.
  DeletePolicyVersion:
    use: DeletePolicyVersion
    entity: policyversion
    group: Policy
    flags:
    - name: PolicyOrn
      required: true
      kind: 24
      help: '[REQUIRED] The OUTSCALE Resource Name (ORN) of the policy.'
    - name: VersionId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the version of the policy you want to delete.'
    help: |-
      Deletes a specified version of a managed policy, if it is not set as the default one.
      
      
      
      
      **[IMPORTANT]**
      
      A delay of up to 15 seconds can occur when attaching, detaching, or updating a managed policy.
    short: Deletes a specified version of a managed policy, if it is not set as the default one.
  DeleteProductType:
    use: DeleteProductType
    entity: producttype
    group: ProductType
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Force
      kind: 1
      help: If true, forces the deletion of the product type associated with one or more OMIs.
    - name: ProductTypeId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the product type you want to delete.'
    help: |-
      Deletes a specified product type that belongs to you.
      
      
      **[WARNING]**
      
      The product type must not be associated with one or more OMIs to be deleted. Otherwise, you need to force the deletion.
      
      If you force the deletion, the product type is deleted and remains associated with the OMIs.
    short: Deletes a specified product type that belongs to you.
  DeletePublicIp:
    use: DeletePublicIp
    entity: publicip
    group: PublicIp
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PublicIp
      kind: 24
      help: The public IP.
    - name: PublicIpId
      kind: 24
      help: The ID representing the association of the public IP with the VM or the NIC.
    help: |-
      Releases a public IP.
      
      You can release a public IP associated with your OUTSCALE account. This address is released in the public IP pool and can be used by someone else. Before releasing a public IP, ensure you updated all your resources communicating with this address.
    short: Releases a public IP.
  DeleteRoute:
    use: DeleteRoute
    content: RouteTable
    entity: route
    group: Route
    flags:
    - name: DestinationIpRange
      required: true
      kind: 24
      help: '[REQUIRED] The exact IP range for the route.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: RouteTableId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the route table from which you want to delete a route.'
    help: Deletes a route from a specified route table.
    short: Deletes a route from a specified route table.
  DeleteRouteTable:
    use: DeleteRouteTable
    entity: routetable
    group: RouteTable
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: RouteTableId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the route table you want to delete.'
    help: |-
      Deletes a specified route table.
      
      Before deleting a route table, you must disassociate it from any Subnet. You cannot delete the main route table.
    short: Deletes a specified route table.
  DeleteSecurityGroup:
    use: DeleteSecurityGroup
    entity: securitygroup
    group: SecurityGroup
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: SecurityGroupId
      kind: 24
      help: The ID of the security group you want to delete.
    - name: SecurityGroupName
      kind: 24
      help: The name of the security group.
    help: |-
      Deletes a specified security group.
      
      You can specify either the name of the security group or its ID.
      
      This action fails if the specified group is associated with a virtual machine (VM) or referenced by another security group.
    short: Deletes a specified security group.
  DeleteSecurityGroupRule:
    use: DeleteSecurityGroupRule
    content: SecurityGroup
    entity: securitygrouprule
    group: SecurityGroupRule
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Flow
      required: true
      kind: 24
      help: '[REQUIRED] The direction of the flow: Inbound or Outbound.'
    - name: FromPortRange
      kind: 2
      help: The beginning of the port range for the TCP and UDP protocols, or an ICMP type number.
    - name: IpProtocol
      kind: 24
      help: The IP protocol name (tcp, udp, icmp, or -1 for all protocols).
    - name: IpRange
      kind: 24
      help: The IP range for the security group rule, in CIDR notation (for example, 10.0.0.0/16).
    - name: 'Rules.#.FromPortRange'
      kind: 2
      help: The beginning of the port range for the TCP and UDP protocols, or an ICMP type number.
    - name: 'Rules.#.IpProtocol'
      kind: 24
      help: The IP protocol name (tcp, udp, icmp, or -1 for all protocols).
    - name: 'Rules.#.IpRanges'
      kind: 24
      container: 23
      help: One or more IP ranges for the security group rules, in CIDR notation (for example, ["10.0.0.0/24" , "10.0.1.0/24"]).
    - name: 'Rules.#.SecurityGroupRuleId'
      kind: 24
      help: The ID of the security group rule.
    - name: 'Rules.#.SecurityGroupsMembers.#.AccountId'
      kind: 24
      help: The OUTSCALE account ID that owns the source or destination security group.
    - name: 'Rules.#.SecurityGroupsMembers.#.SecurityGroupId'
      kind: 24
      help: The ID of a source or destination security group that you want to link to the security group of the rule.
    - name: 'Rules.#.SecurityGroupsMembers.#.SecurityGroupName'
      kind: 24
      help: The name of a source or destination security group that you want to link to the security group of the rule.
    - name: 'Rules.#.ServiceIds'
      kind: 24
      container: 23
      help: One or more service IDs to allow traffic from a Net to access the corresponding OUTSCALE services.
    - name: 'Rules.#.ToPortRange'
      kind: 2
      help: The end of the port range for the TCP and UDP protocols, or an ICMP code number.
    - name: SecurityGroupAccountIdToUnlink
      kind: 24
      help: The OUTSCALE account ID of the owner of the security group you want to delete a rule from.
    - name: SecurityGroupId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the security group you want to delete a rule from.'
    - name: SecurityGroupNameToUnlink
      kind: 24
      help: The ID of the source security group.
    - name: ToPortRange
      kind: 2
      help: The end of the port range for the TCP and UDP protocols, or an ICMP code number.
    help: |-
      Deletes one or more inbound or outbound rules from a security group.
      
      For the rule to be deleted, the values specified in the deletion request must exactly match the value of the existing rule.
      
      In case of TCP and UDP protocols, you have to indicate the destination port or range of ports. In case of ICMP protocol, you have to specify the ICMP type and code numbers.
      
      Rules (IP permissions) consist of the protocol, IP range or source security group.
      
      To remove outbound access to a destination security group, we recommend to use a set of IP permissions. We also recommend to specify the protocol in a set of IP permissions.
      
      
      Alternatively, you can use the `Rules` parameter to delete several rules at the same time.
    short: Deletes one or more inbound or outbound rules from a security group.
  DeleteServerCertificate:
    use: DeleteServerCertificate
    entity: servercertificate
    group: ServerCertificate
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Name
      required: true
      kind: 24
      help: '[REQUIRED] The name of the server certificate you want to delete.'
    help: Deletes a specified server certificate.
    short: Deletes a specified server certificate.
  DeleteSnapshot:
    use: DeleteSnapshot
    entity: snapshot
    group: Snapshot
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: SnapshotId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the snapshot you want to delete.'
    help: |-
      Deletes a specified snapshot.
      
      You cannot delete a snapshot that is currently used by an OUTSCALE machine image (OMI). To do so, you first need to delete the corresponding OMI. For more information, see the [DeleteImage](#deleteimage) method.
    short: Deletes a specified snapshot.
  DeleteSubnet:
    use: DeleteSubnet
    entity: subnet
    group: Subnet
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: SubnetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Subnet you want to delete.'
    help: |-
      Deletes a specified Subnet.
      
      Before deleting the Subnet, you need to delete all resources associated with the Subnet:
      
      
      
      * Virtual machines (VMs)
      
      * Network Interface Cards (NICs)
      
      * NAT services
      
      * Load balancers
    short: Deletes a specified Subnet.
  DeleteTags:
    use: DeleteTags
    entity: tag
    group: Tag
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: ResourceIds
      kind: 24
      container: 23
      help: One or more resource IDs.
    - name: 'Tags.#.Key'
      kind: 24
      help: The key of the tag, between 1 and 255 characters.
    - name: 'Tags.#.Value'
      kind: 24
      help: The value of the tag, between 0 and 255 characters.
    help: Deletes one or more tags from the specified resources.
    short: Deletes one or more tags from the specified resources.
  DeleteUser:
    use: DeleteUser
    entity: user
    group: User
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: UserName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the EIM user you want to delete.'
    help: Deletes a specified EIM user. The EIM user must not belong to any group, nor have any key or linked policy.
    short: Deletes a specified EIM user.
  DeleteUserGroup:
    use: DeleteUserGroup
    entity: usergroup
    group: UserGroup
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Force
      kind: 1
      help: If true, forces the deletion of the user group even if it is not empty.
    - name: Path
      kind: 24
      help: The path to the group.
    - name: UserGroupName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the group you want to delete.'
    help: |-
      Deletes a specified user group.
      
      
      **[WARNING]**
      
      The user group must be empty of any user and must not have any linked policy. Otherwise, you need to force the deletion.
      
      If you force the deletion, all inline policies will be deleted with the user group.
    short: Deletes a specified user group.
  DeleteUserGroupPolicy:
    use: DeleteUserGroupPolicy
    entity: usergrouppolicy
    group: Policy
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PolicyName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the policy document you want to delete.'
    - name: UserGroupName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the group.'
    - name: UserGroupPath
      kind: 24
      help: The path to the group.
    help: |-
      Deletes a specified inline policy from a specific group.
      
      
      
      
      **[IMPORTANT]**
      
      A delay of up to 15 seconds can occur when creating or deleting an inline policy.
    short: Deletes a specified inline policy from a specific group.
  DeleteUserPolicy:
    use: DeleteUserPolicy
    entity: userpolicy
    group: Policy
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PolicyName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the policy document you want to delete (between 1 and 128 characters).'
    - name: UserName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the user you want to delete the policy from.'
    help: |-
      Deletes a specified inline policy from a specific user.
      
      
      
      
      **[IMPORTANT]**
      
      A delay of up to 15 seconds can occur when creating or deleting an inline policy.
    short: Deletes a specified inline policy from a specific user.
  DeleteVirtualGateway:
    use: DeleteVirtualGateway
    entity: virtualgateway
    group: VirtualGateway
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: VirtualGatewayId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the virtual gateway you want to delete.'
    help: |-
      Deletes a specified virtual gateway.
      
      **[IMPORTANT]**
      
      Before deleting a virtual gateway, we recommend detaching it from any associated Net, DirectLink, and DirectLink interface, and deleting the VPN connection.
    short: Deletes a specified virtual gateway.
  DeleteVmGroup:
    use: DeleteVmGroup
    entity: vmgroup
    group: VmGroup
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: VmGroupId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the VM group you want to delete.'
    help: |-
      > [WARNING]
      
      > This feature is currently under development and may not function properly.
      
      
      Deletes a specified VM group.
    short: '> [WARNING] > This feature is currently under development and may not function properly.'
  DeleteVmTemplate:
    use: DeleteVmTemplate
    entity: vmtemplate
    group: VmTemplate
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: VmTemplateId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the VM template you want to delete.'
    help: |-
      > [WARNING]
      
      > This feature is currently under development and may not function properly.
      
      
      Deletes a virtual machine (VM) template.
      
      You cannot delete a template currently used by a VM group.
    short: '> [WARNING] > This feature is currently under development and may not function properly.'
  DeleteVms:
    use: DeleteVms
    content: Vms
    entity: vm
    group: Vm
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: VmIds
      kind: 24
      container: 23
      help: One or more IDs of VMs.
    help: |-
      Terminates one or more virtual machines (VMs).
      
      This operation is idempotent, that means that all calls succeed if you terminate a VM more than once.
    short: Terminates one or more virtual machines (VMs).
  DeleteVolume:
    use: DeleteVolume
    entity: volume
    group: Volume
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: VolumeId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the volume you want to delete.'
    help: |-
      Deletes a specified Block Storage Unit (BSU) volume.
      
      You can delete available volumes only, that is, volumes that are not attached to a virtual machine (VM).
    short: Deletes a specified Block Storage Unit (BSU) volume.
  DeleteVpnConnection:
    use: DeleteVpnConnection
    entity: vpnconnection
    group: VpnConnection
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: VpnConnectionId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the VPN connection you want to delete.'
    help: |-
      Deletes a specified VPN connection.
      
      If you want to delete a Net and all its dependencies, we recommend to detach the virtual gateway from the Net and delete the Net before deleting the VPN connection. This enables you to delete the Net without waiting for the VPN connection to be deleted.
    short: Deletes a specified VPN connection.
  DeleteVpnConnectionRoute:
    use: DeleteVpnConnectionRoute
    entity: vpnconnectionroute
    group: VpnConnection
    flags:
    - name: DestinationIpRange
      required: true
      kind: 24
      help: '[REQUIRED] The network prefix of the route to delete, in CIDR notation (for example, 10.12.0.0/16).'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: VpnConnectionId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the target VPN connection of the static route to delete.'
    help: Deletes a static route to a VPN connection previously created using the CreateVpnConnectionRoute method.
    short: Deletes a static route to a VPN connection previously created using the CreateVpnConnectionRoute method.
  DeregisterVmsInLoadBalancer:
    use: DeregisterVmsInLoadBalancer
    entity: vmsinloadbalancer
    group: LoadBalancer
    flags:
    - name: BackendVmIds
      kind: 24
      container: 23
      help: One or more IDs of backend VMs.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: LoadBalancerName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the load balancer.'
    help: |-
      > [WARNING]
      
      > Deprecated: This call is deprecated and will be removed.
      
      
      Deregisters a specified virtual machine (VM) from a load balancer.
    short: '> [WARNING] > Deprecated: This call is deprecated and will be removed.'
  DisableOutscaleLogin:
    use: DisableOutscaleLogin
    entity: outscalelogin
    group: IdentityProvider
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: Disables the possibility of logging in using the Outscale credentials of your root user when identity federation is activated.
    short: Disables the possibility of logging in using the Outscale credentials of your root user when identity federation is activated.
  DisableOutscaleLoginForUsers:
    use: DisableOutscaleLoginForUsers
    entity: outscaleloginforuser
    group: IdentityProvider
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: Disables the possibility of logging in using the Outscale credentials of your EIM users when identity federation is activated.
    short: Disables the possibility of logging in using the Outscale credentials of your EIM users when identity federation is activated.
  DisableOutscaleLoginPerUsers:
    use: DisableOutscaleLoginPerUsers
    entity: outscaleloginperuser
    group: IdentityProvider
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: UserNames
      kind: 24
      container: 23
      help: The usernames of the EIM users you want to disable the Outscale login for.
    help: Disables the possibility for one or more specific users to log in using their Outscale credentials when identity federation is activated.
    short: Disables the possibility for one or more specific users to log in using their Outscale credentials when identity federation is activated.
  EnableOutscaleLogin:
    use: EnableOutscaleLogin
    entity: outscalelogin
    group: IdentityProvider
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: Enables the possibility of logging in using the Outscale credentials of your root user when identity federation is activated.
    short: Enables the possibility of logging in using the Outscale credentials of your root user when identity federation is activated.
  EnableOutscaleLoginForUsers:
    use: EnableOutscaleLoginForUsers
    entity: outscaleloginforuser
    group: IdentityProvider
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: Enables the possibility for all your EIM users to log in using their Outscale credentials when identity federation is activated.
    short: Enables the possibility for all your EIM users to log in using their Outscale credentials when identity federation is activated.
  EnableOutscaleLoginPerUsers:
    use: EnableOutscaleLoginPerUsers
    entity: outscaleloginperuser
    group: IdentityProvider
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: UserNames
      kind: 24
      container: 23
      help: The usernames of the EIM users you want to enable the Outscale login for.
    help: Enables the possibility for one or more specific users to log in using their Outscale credentials when identity federation is activated.
    short: Enables the possibility for one or more specific users to log in using their Outscale credentials when identity federation is activated.
  LinkFlexibleGpu:
    use: LinkFlexibleGpu
    entity: flexiblegpu
    group: FlexibleGpu
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: FlexibleGpuId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the fGPU you want to attach.'
    - name: VmId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the VM you want to attach the fGPU to.'
    help: |-
      Attaches one of your allocated flexible GPUs (fGPUs) to one of your virtual machines (VMs).
      
      To complete the linking of the fGPU, you need to do a stop/start of the VM. A simple restart is not sufficient, as the linking of the fGPU is done when the VM goes through the `stopped` state. For the difference between stop/start and restart, see [About VM Lifecycle](https://docs.outscale.com/en/userguide/About-VM-Lifecycle.html).
      
      
      
      **[NOTE]**
      
      You can attach fGPUs only to VMs with the `highest` (1) performance flag. For more information see [About Flexible GPUs](https://docs.outscale.com/en/userguide/About-Flexible-GPUs.html) and [VM Types](https://docs.outscale.com/en/userguide/VM-Types.html).
    short: Attaches one of your allocated flexible GPUs (fGPUs) to one of your virtual machines (VMs).
  LinkInternetService:
    use: LinkInternetService
    entity: internetservice
    group: InternetService
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: InternetServiceId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the internet service you want to attach.'
    - name: NetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net to which you want to attach the internet service.'
    help: |-
      Attaches an internet service to a Net.
      
      To enable the connection between the Internet and a Net, you must attach an internet service to this Net.
    short: Attaches an internet service to a Net.
  LinkLoadBalancerBackendMachines:
    use: LinkLoadBalancerBackendMachines
    entity: loadbalancerbackendmachine
    group: LoadBalancer
    flags:
    - name: BackendIps
      kind: 24
      container: 23
      help: One or more public IPs of backend VMs.
    - name: BackendVmIds
      kind: 24
      container: 23
      help: One or more IDs of backend VMs.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: LoadBalancerName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the load balancer.'
    help: |-
      Attaches one or more virtual machines (VMs) to a specified load balancer. You need to specify at least the `BackendIps` or the `BackendVmIds` parameter.
      
      The VMs can be in different Subnets and different Subregions than the load balancer, as long as the VMs and load balancers are all in the public Cloud or all in the same Net. It may take a little time for a VM to be registered with the load balancer. Once the VM is registered with a load balancer, it receives traffic and requests from this load balancer and is called a backend VM.
    short: Attaches one or more virtual machines (VMs) to a specified load balancer.
  LinkManagedPolicyToUserGroup:
    use: LinkManagedPolicyToUserGroup
    entity: managedpolicytousergroup
    group: Policy
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PolicyOrn
      required: true
      kind: 24
      help: '[REQUIRED] The OUTSCALE Resource Name (ORN) of the policy.'
    - name: UserGroupName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the group you want to link the policy to.'
    help: |-
      Links a managed policy to a specific group. This policy applies to all the users contained in this group.
      
      
      
      
      **[IMPORTANT]**
      
      A delay of up to 15 seconds can occur when attaching, detaching, or updating a managed policy.
    short: Links a managed policy to a specific group.
  LinkNic:
    use: LinkNic
    entity: nic
    group: Nic
    flags:
    - name: DeviceNumber
      required: true
      kind: 2
      help: '[REQUIRED] The index of the VM device for the NIC attachment (between 1 and 7, both included).'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NicId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the NIC you want to attach.'
    - name: VmId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the VM to which you want to attach the NIC.'
    help: |-
      Attaches a network interface card (NIC) to a virtual machine (VM).
      
      The interface and the VM must be in the same Subregion. The VM can be either `running` or `stopped`. The NIC must be in the `available` state. For more information, see [Attaching a NIC to a VM](https://docs.outscale.com/en/userguide/Attaching-a-NIC-to-a-VM.html).
    short: Attaches a network interface card (NIC) to a virtual machine (VM).
  LinkPolicy:
    use: LinkPolicy
    entity: policy
    group: Policy
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PolicyOrn
      required: true
      kind: 24
      help: '[REQUIRED] The OUTSCALE Resource Name (ORN) of the policy.'
    - name: UserName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the user you want to link the policy to (between 1 and 64 characters).'
    help: |-
      Links a managed policy to a specific user.
      
      
      
      
      **[IMPORTANT]**
      
      A delay of up to 15 seconds can occur when attaching, detaching, or updating a managed policy.
    short: Links a managed policy to a specific user.
  LinkPrivateIps:
    use: LinkPrivateIps
    entity: privateipsips
    group: Nic
    flags:
    - name: AllowRelink
      kind: 1
      help: If true, allows an IP that is already assigned to another NIC in the same Subnet to be assigned to the NIC you specified.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NicId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the NIC.'
    - name: PrivateIps
      kind: 24
      container: 23
      help: The secondary private IP or IPs you want to assign to the NIC within the IP range of the Subnet.
    - name: SecondaryPrivateIpCount
      kind: 2
      help: The number of secondary private IPs to assign to the NIC.
    help: Assigns one or more secondary private IPs to a specified network interface card (NIC). This action is only available in a Net. The private IPs to be assigned can be added individually using the `PrivateIps` parameter, or you can specify the number of private IPs to be automatically chosen within the Subnet range using the `SecondaryPrivateIpCount` parameter. You can specify only one of these two parameters. If none of these parameters are specified, a private IP is chosen within the Subnet range.
    short: Assigns one or more secondary private IPs to a specified network interface card (NIC).
  LinkPublicIp:
    use: LinkPublicIp
    entity: publicip
    group: PublicIp
    flags:
    - name: AllowRelink
      kind: 1
      help: If true, allows the public IP to be associated with the VM or NIC that you specify even if it is already associated with another VM or NIC.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NicId
      kind: 24
      help: (Net only) The ID of the NIC.
    - name: PrivateIp
      kind: 24
      help: (Net only) The primary or secondary private IP of the specified NIC.
    - name: PublicIp
      kind: 24
      help: The public IP.
    - name: PublicIpId
      kind: 24
      help: The allocation ID of the public IP.
    - name: VmId
      kind: 24
      help: The ID of the VM.
    help: |-
      Associates a public IP with a virtual machine (VM) or a network interface card (NIC), in the public Cloud or in a Net. You can associate a public IP with only one VM or network interface at a time.
      
      To associate a public IP in a Net, ensure that the Net has an internet service attached. For more information, see the [LinkInternetService](#linkinternetservice) method.
      
      By default, the public IP is disassociated every time you stop and start the VM. For a persistent association, you can add the `osc.fcu.eip.auto-attach` tag to the VM with the public IP as value. For more information, see the [CreateTags](#createtags) method.
      
      
      
      **[IMPORTANT]**
      
      You can associate a public IP with a network address translation (NAT) service only when creating the NAT service. To modify its public IP, you need to delete the NAT service and re-create it with the new public IP. For more information, see the [CreateNatService](#createnatservice) method.
    short: Associates a public IP with a virtual machine (VM) or a network interface card (NIC), in the public Cloud or in a Net.
  LinkRouteTable:
    use: LinkRouteTable
    entity: routetable
    group: RouteTable
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: RouteTableId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the route table.'
    - name: SubnetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Subnet.'
    help: |-
      Associates a Subnet with a route table.
      
      The Subnet and the route table must be in the same Net. The traffic is routed according to the route table defined within this Net. You can associate a route table with several Subnets.
    short: Associates a Subnet with a route table.
  LinkVirtualGateway:
    use: LinkVirtualGateway
    content: NetToVirtualGatewayLink
    entity: virtualgateway
    group: VirtualGateway
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net to which you want to attach the virtual gateway.'
    - name: VirtualGatewayId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the virtual gateway.'
    help: |-
      Attaches a virtual gateway to a Net.
      
      **[IMPORTANT]**
      
      This action can be done only if the virtual gateway is in the `available` state.
    short: Attaches a virtual gateway to a Net.
  LinkVolume:
    use: LinkVolume
    entity: volume
    group: Volume
    flags:
    - name: DeviceName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the device.'
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: VmId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the VM you want to attach the volume to.'
    - name: VolumeId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the volume you want to attach.'
    help: |-
      Attaches a Block Storage Unit (BSU) volume to a virtual machine (VM).
      
      The volume and the VM must be in the same Subregion. The VM can be running or stopped. The volume is attached to the specified VM device.
    short: Attaches a Block Storage Unit (BSU) volume to a virtual machine (VM).
  PutUserGroupPolicy:
    use: PutUserGroupPolicy
    entity: usergrouppolicy
    group: Policy
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PolicyDocument
      required: true
      kind: 24
      customValue: fileOrJson
      help: Either a file storing the policy document, or the policy document (in JSON format).
    - name: PolicyName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the policy.'
    - name: UserGroupName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the group.'
    - name: UserGroupPath
      kind: 24
      help: The path to the group.
    help: |-
      Creates or updates an inline policy included in a specified group.
      
      The policy is automatically applied to all the users of the group after its creation.
      
      
      
      
      **[IMPORTANT]**
      
      A delay of up to 15 seconds can occur when creating or deleting an inline policy.
    short: Creates or updates an inline policy included in a specified group.
  PutUserPolicy:
    use: PutUserPolicy
    entity: userpolicy
    group: Policy
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PolicyDocument
      required: true
      kind: 24
      customValue: fileOrJson
      help: Either a file storing the policy document, or the policy document (in JSON format).
    - name: PolicyName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the policy (between 1 and 128 characters).'
    - name: UserName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the user.'
    help: |-
      Creates or updates an inline policy included in a specified user.
      
      The policy is automatically applied to the user after its creation.
      
      
      
      
      **[IMPORTANT]**
      
      A delay of up to 15 seconds can occur when creating or deleting an inline policy.
    short: Creates or updates an inline policy included in a specified user.
  ReadAccessKeys:
    use: ReadAccessKeys
    content: AccessKeys
    entity: accesskey
    group: AccessKey
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Filters.AccessKeyIds
      kind: 24
      container: 23
      help: The IDs of the access keys.
    - name: Filters.States
      kind: 24
      container: 23
      help: The states of the access keys (ACTIVE | INACTIVE).
      values:
      - ACTIVE
      - INACTIVE
    - name: Tag
      kind: 24
      help: The tag added to the access key.
    - name: UserName
      kind: 24
      help: The name of the EIM user.
    help: Lists the access key IDs of either your root user or an EIM user.
    short: Lists the access key IDs of either your root user or an EIM user.
  ReadAccounts:
    use: ReadAccounts
    content: Accounts
    entity: account
    group: Account
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: Gets information about the account that sent the request.
    short: Gets information about the account that sent the request.
  ReadAdminPassword:
    use: ReadAdminPassword
    entity: adminpassword
    group: Vm
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: VmId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the VM.'
    help: |-
      Gets the administrator password for a Windows running virtual machine (VM).
      
      The administrator password is encrypted using the keypair you specified when launching the VM.
      
      
      
      **[IMPORTANT]**
      
      * Only RSA keypairs can decrypt the password of a Windows VM.
      
      * The administrator password is generated only on the first boot of the Windows VM. It is not returned after the first boot.
    short: Gets the administrator password for a Windows running virtual machine (VM).
  ReadApiAccessPolicy:
    use: ReadApiAccessPolicy
    content: ApiAccessPolicy
    entity: apiaccesspolicy
    group: ApiAccessPolicy
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    help: |-
      Gets information about the API access policy of your OUTSCALE account.
      
      
      For more information, see [About Your API Access Policy](https://docs.outscale.com/en/userguide/About-Your-API-Access-Policy.html).
    short: Gets information about the API access policy of your OUTSCALE account.
  ReadApiAccessRules:
    use: ReadApiAccessRules
    content: ApiAccessRules
    entity: apiaccessrule
    group: ApiAccessRule
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Filters.ApiAccessRuleIds
      kind: 24
      container: 23
      help: One or more IDs of API access rules.
    - name: Filters.CaIds
      kind: 24
      container: 23
      help: One or more IDs of Client Certificate Authorities (CAs).
    - name: Filters.Cns
      kind: 24
      container: 23
      help: One or more Client Certificate Common Names (CNs).
    - name: Filters.Descriptions
      kind: 24
      container: 23
      help: One or more descriptions of API access rules.
    - name: Filters.IpRanges
      kind: 24
      container: 23
      help: One or more IPs or CIDR blocks (for example, 192.0.2.0/16).
    help: Lists one or more API access rules.
    short: Lists one or more API access rules.
  ReadApiLogs:
    use: ReadApiLogs
    content: Logs
    entity: apilog
    group: ApiLog
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: Filters.QueryAccessKeys
      kind: 24
      container: 23
      help: The access keys used for the logged calls.
    - name: Filters.QueryApiNames
      kind: 24
      container: 23
      help: The names of the APIs of the logged calls (always oapi for the OUTSCALE API).
    - name: Filters.QueryCallNames
      kind: 24
      container: 23
      help: The names of the logged calls.
    - name: Filters.QueryDateAfter
      kind: 24
      customValue: osctime
      help: The date and time, or the date, after which you want to retrieve logged calls, in ISO 8601 format (for example, 2020-06-14T00:00:00.000Z or 2020-06-14).
    - name: Filters.QueryDateBefore
      kind: 24
      customValue: osctime
      help: The date and time, or the date, before which you want to retrieve logged calls, in ISO 8601 format (for example, 2020-06-30T00:00:00.000Z or 2020-06-14).
    - name: Filters.QueryIpAddresses
      kind: 24
      container: 23
      help: The IPs used for the logged calls.
    - name: Filters.QueryUserAgents
      kind: 24
      container: 23
      help: The user agents of the HTTP requests of the logged calls.
    - name: Filters.RequestIds
      kind: 24
      container: 23
      help: The request IDs provided in the responses of the logged calls.
    - name: Filters.ResponseStatusCodes
      kind: 2
      container: 23
      help: The HTTP status codes of the logged calls.
    - name: With.AccountId
      kind: 1
      help: If true, the OUTSCALE account ID is displayed.
    - name: With.CallDuration
      kind: 1
      help: If true, the duration of the call is displayed.
    - name: With.QueryAccessKey
      kind: 1
      help: If true, the access key is displayed.
    - name: With.QueryApiName
      kind: 1
      help: If true, the name of the API is displayed.
    - name: With.QueryApiVersion
      kind: 1
      help: If true, the version of the API is displayed.
    - name: With.QueryCallName
      kind: 1
      help: If true, the name of the call is displayed.
    - name: With.QueryDate
      kind: 1
      help: If true, the date of the call is displayed.
    - name: With.QueryHeaderRaw
      kind: 1
      help: If true, the raw header of the HTTP request is displayed.
    - name: With.QueryHeaderSize
      kind: 1
      help: If true, the size of the raw header of the HTTP request is displayed.
    - name: With.QueryIpAddress
      kind: 1
      help: If true, the IP is displayed.
    - name: With.QueryPayloadRaw
      kind: 1
      help: If true, the raw payload of the HTTP request is displayed.
    - name: With.QueryPayloadSize
      kind: 1
      help: If true, the size of the raw payload of the HTTP request is displayed.
    - name: With.QueryUserAgent
      kind: 1
      help: If true, the user agent of the HTTP request is displayed.
    - name: With.RequestId
      kind: 1
      help: If true, the request ID is displayed.
    - name: With.ResponseSize
      kind: 1
      help: If true, the size of the response is displayed.
    - name: With.ResponseStatusCode
      kind: 1
      help: If true, the HTTP status code of the response is displayed.
    help: |-
      Lists the logs of the API calls you have performed with this OUTSCALE account.
      
      **[IMPORTANT]**
      
      Past logs are accessible for up to 32 days.
      
      By default, the retrieved interval is 48 hours. If neither of the `QueryDateBefore` nor `QueryDateAfter` parameters are specified, logs from the past 48 hours are retrieved. If you only specify one of two, logs are retrieved from a 2-day interval based on the date you provided. To retrieve logs beyond a 2-day interval, specify both parameters.
      
      
      For more information, see [About OMS](https://docs.outscale.com/en/userguide/About-OMS.html).
    short: Lists the logs of the API calls you have performed with this OUTSCALE account.
  ReadCO2EmissionAccount:
    use: ReadCO2EmissionAccount
    content: CO2EmissionEntries
    entity: co2emissionaccount
    group: Account
    flags:
    - name: FromMonth
      required: true
      kind: 24
      customValue: osctime
      help: '[REQUIRED] The beginning of the time period, in ISO 8601 date format (for example, 2020-06-01).'
    - name: Overall
      kind: 1
      help: If false, returns only the CO2 emission of the specific account that sends the request.
    - name: ToMonth
      required: true
      kind: 24
      customValue: osctime
