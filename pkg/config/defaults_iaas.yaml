      help: One or more IDs of backend VMs.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: LoadBalancerName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the load balancer.'
