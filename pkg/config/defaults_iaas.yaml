      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: HealthCheck.CheckInterval
      kind: 2
      help: The number of seconds between two requests (between 5 and 600 both included).
    - name: HealthCheck.HealthyThreshold
      kind: 2
      help: The number of consecutive successful requests before considering the VM as healthy (between 2 and 10 both included).
    - name: HealthCheck.Path
      kind: 24
      help: If you use the HTTP or HTTPS protocols, the request URL path.
    - name: HealthCheck.Port
      kind: 2
      help: The port number (between 1 and 65535, both included).
    - name: HealthCheck.Protocol
      kind: 24
      help: The protocol for the URL of the VM (HTTP | HTTPS | TCP | SSL).
    - name: HealthCheck.Timeout
      kind: 2
      help: The maximum waiting time for a response before considering the VM as unhealthy, in seconds (between 2 and 60 both included).
    - name: HealthCheck.UnhealthyThreshold
      kind: 2
      help: The number of consecutive failed requests before considering the VM as unhealthy (between 2 and 10 both included).
    - name: LoadBalancerName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the load balancer.'
    - name: LoadBalancerPort
      kind: 2
      help: The port on which the load balancer is listening (between 1 and 65535, both included).
    - name: PolicyNames
      kind: 24
      container: 23
      help: The name of the policy you want to enable for the listener.
    - name: PublicIp
      kind: 24
      help: (internet-facing only) The public IP you want to associate with the load balancer.
    - name: SecuredCookies
      kind: 1
      help: If true, secure cookies are enabled for the load balancer.
    - name: SecurityGroups
      kind: 24
      container: 23
      help: (Net only) One or more IDs of security groups you want to assign to the load balancer.
    - name: ServerCertificateId
      kind: 24
      help: The OUTSCALE Resource Name (ORN) of the server certificate.
    help: |-
      Modifies the specified attribute of a load balancer. You can specify only one attribute at a time.
      
      
      
      You can set a new SSL certificate to an SSL or HTTPS listener of a load balancer.
      
      This certificate replaces any certificate used on the same load balancer and port.
      
      
      
      You can also replace the currently enabled policy for the load balancer with another one.
      
      If the `PolicyNames` parameter is empty, the currently enabled policy is disabled.
