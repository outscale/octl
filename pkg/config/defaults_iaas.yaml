      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: ForceUnlink
      kind: 1
      help: Forces the detachment of the volume in case of previous failure.
    - name: VolumeId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the volume you want to detach.'
    help: |-
      Detaches a Block Storage Unit (BSU) volume from a virtual machine (VM).
      
      To detach the root device of a VM, this VM must be stopped.
    short: Detaches a Block Storage Unit (BSU) volume from a virtual machine (VM).
  UpdateAccessKey:
    use: UpdateAccessKey
    content: AccessKey
    entity: accesskey
    group: AccessKey
    flags:
    - name: AccessKeyId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the access key.'
    - name: ClearExpirationDate
      kind: 1
      help: If true, the current expiration date is deleted and the access key is set to not expire.
    - name: ClearTag
      kind: 1
      help: If true, the current tag of the access key is deleted.
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: ExpirationDate
      kind: 24
      customValue: osctime
      help: The date and time, or the date, at which you want the access key to expire, in ISO 8601 format (for example, 2020-06-14T00:00:00.000Z or 2020-06-14).
    - name: State
      kind: 24
      help: The new state for the access key (ACTIVE | INACTIVE).
    - name: Tag
      kind: 24
      help: A new tag to add to the access key.
    - name: UserName
      kind: 24
      help: The name of the EIM user that the access key you want to modify is associated with.
    help: |-
      Modifies the attributes of the specified access key of either the root user or an EIM user.
      
      
      The parameter `ExpirationDate` is not required when updating the state of your access key. However, if you do not specify the expiration date of an access key when updating its state, it is then set to not expire.
    short: Modifies the attributes of the specified access key of either the root user or an EIM user.
  UpdateAccount:
    use: UpdateAccount
    content: Account
    entity: account
    group: Account
    flags:
    - name: AdditionalEmails
      kind: 24
      container: 23
      help: One or more additional email addresses for the account.
