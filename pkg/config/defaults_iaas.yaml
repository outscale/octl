    - name: Filters.VmIds
      kind: 24
      container: 23
      help: One or more IDs of VMs.
    - name: Filters.VmStates
      kind: 24
      container: 23
      help: The states of the VMs (pending | running | stopping | stopped | shutting-down | terminated | quarantine).
      values:
      - pending
      - quarantine
      - running
      - shutting-down
      - stopped
      - stopping
      - terminated
    help: Lists the status of one or more virtual machines (VMs).
    short: Lists the status of one or more virtual machines (VMs).
  ReadVmsStopHistory:
    use: ReadVmsStopHistory
    content: VmsStopHistory
    entity: vmsstophistory
