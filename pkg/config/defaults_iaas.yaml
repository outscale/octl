  UpdateLoadBalancer:
    use: UpdateLoadBalancer
    content: LoadBalancer
    entity: loadbalancer
    group: LoadBalancer
    flags:
    - name: AccessLog.IsEnabled
      kind: 1
      help: If true, access logs are enabled for your load balancer.
    - name: AccessLog.OsuBucketName
      kind: 24
      help: The name of the OOS bucket for the access logs.
    - name: AccessLog.OsuBucketPrefix
      kind: 24
