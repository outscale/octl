      kind: 24
      help: '[REQUIRED] The ID of the Net peering you want to reject.'
    help: |-
      Rejects a Net peering request.
      
      The Net peering must be in the `pending-acceptance` state to be rejected. The rejected Net peering is then in the `rejected` state.
    short: Rejects a Net peering request.
  RemoveUserFromUserGroup:
    use: RemoveUserFromUserGroup
    entity: userfromusergroup
