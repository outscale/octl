  UpdateVm:
    use: UpdateVm
    content: Vm
    entity: vm
    group: Vm
    flags:
    - name: ActionsOnNextBoot.SecureBoot
      kind: 24
      help: One action to perform on the next boot of the VM (enable | disable | setup-mode | none).
      values:
      - disable
      - enable
      - none
      - restore-factory-keys
      - setup-mode
    - name: 'BlockDeviceMappings.#.Bsu.DeleteOnVmDeletion'
      kind: 1
      help: If set to true, the volume is deleted when terminating the VM.
