      required: true
      kind: 24
      help: '[REQUIRED] The ID of the attachment operation.'
    help: |-
      Detaches a network interface card (NIC) from a virtual machine (VM).
      
      The primary NIC cannot be detached.
    short: Detaches a network interface card (NIC) from a virtual machine (VM).
  UnlinkPolicy:
    use: UnlinkPolicy
    entity: policy
    group: Policy
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PolicyOrn
      required: true
      kind: 24
      help: '[REQUIRED] The OUTSCALE Resource Name (ORN) of the policy.'
    - name: UserName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the user you want to detach the policy from.'
    help: |-
      Removes a managed policy from a specific user.
      
      
      
      
      **[IMPORTANT]**
      
      A delay of up to 15 seconds can occur when attaching, detaching, or updating a managed policy.
    short: Removes a managed policy from a specific user.
  UnlinkPrivateIps:
    use: UnlinkPrivateIps
    entity: privateipsips
    group: Nic
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NicId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the NIC.'
    - name: PrivateIps
      kind: 24
      container: 23
      help: One or more secondary private IPs you want to unassign from the NIC.
    help: Unassigns one or more secondary private IPs from a network interface card (NIC).
    short: Unassigns one or more secondary private IPs from a network interface card (NIC).
  UnlinkPublicIp:
    use: UnlinkPublicIp
    entity: publicip
    group: PublicIp
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: LinkPublicIpId
      kind: 24
      help: The ID representing the association of the public IP with the VM or the NIC.
    - name: PublicIp
      kind: 24
      help: The public IP.
    help: |-
      Disassociates a public IP from the virtual machine (VM) or network interface card (NIC) it is associated with.
      
      
      
      **[IMPORTANT]**
      
      To disassociate the public IP from a NAT service, you need to delete the NAT service. For more information, see the [DeleteNatService](#deletenatservice) method.
    short: Disassociates a public IP from the virtual machine (VM) or network interface card (NIC) it is associated with.
  UnlinkRouteTable:
    use: UnlinkRouteTable
    entity: routetable
    group: RouteTable
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: LinkRouteTableId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the association between the route table and the Subnet.'
    help: |-
      Disassociates a Subnet from a route table.
      
      After disassociation, the Subnet can no longer use the routes in this route table, but uses the routes in the main route table of the Net instead.
    short: Disassociates a Subnet from a route table.
  UnlinkVirtualGateway:
    use: UnlinkVirtualGateway
    entity: virtualgateway
    group: VirtualGateway
    flags:
    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: NetId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the Net from which you want to detach the virtual gateway.'
    - name: VirtualGatewayId
      required: true
      kind: 24
      help: '[REQUIRED] The ID of the virtual gateway.'
    help: |-
      Detaches a virtual gateway from a Net.
      
      You must wait until the virtual gateway is in the detached state before you can attach another Net to it or delete the Net it was previously attached to.
    short: Detaches a virtual gateway from a Net.
  UnlinkVolume:
    use: UnlinkVolume
    entity: volume
    group: Volume
    flags:
