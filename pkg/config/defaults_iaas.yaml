    - name: DryRun
      kind: 1
      help: If true, checks whether you have the required permissions to perform the action.
    - name: PolicyOrn
      required: true
      kind: 24
      help: '[REQUIRED] The OUTSCALE Resource Name (ORN) of the policy.'
    - name: UserGroupName
      required: true
      kind: 24
      help: '[REQUIRED] The name of the group you want to unlink the policy from.'
