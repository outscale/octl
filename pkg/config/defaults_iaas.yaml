    - name: RequireTrustedEnv
      required: true
      kind: 1
      help: '[REQUIRED] If true, a trusted session is activated, provided that you specify the MaxAccessKeyExpirationSeconds parameter with a value greater than 0.'
    help: |-
      Updates the API access policy of your OUTSCALE account.
      
      
      
