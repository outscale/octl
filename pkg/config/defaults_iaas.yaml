- entity: consumptionaccount
  sub_command: aggregate
  use: compute
  short: Aggregate all compute costs using ReadConsumptionAccount
  alias_to: ReadConsumptionAccount
  alias_help: ReadConsumptionAccount
  command:
  - api
  - ReadConsumptionAccount
  - --ShowPrice
  - --jq
  - |
    [
      .ConsumptionEntries[]
      | select(
          (.Operation == "RunInstances-OD" and (.Type | test("^BoxUsage:")))
          or
          (.Operation == "RunDedicatedInstances-OD" and (.Type | test("^BoxUsage:")))           or
          (.Operation == "RunDedicatedInstances" and .Type == "UseDedicated")                   or
          (.Operation == "RunDedicatedGroupsInstances" and .Type == "UseDedicatedGroups")
        )
    ]
    | map(.Price)
    | add
  - --single
  - --output
  - raw
  flags:
  - name: from-date
    alias_to: FromDate
    default: beginning-of-month
  - name: overall
    alias_to: Overall
  - name: to-date
    alias_to: ToDate
    default: today
