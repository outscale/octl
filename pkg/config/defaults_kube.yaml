api:
  CreateCluster:
    use: CreateCluster
    content: Cluster
    entity: cluster
    group: Clusters
    flags:
    - name: AdminLbu
      kind: 1
      help: Flag to enable admin load balancer for cluster management
    - name: AdminWhitelist
      kind: 24
      container: 23
      help: List of CIDR blocks or IP addresses allowed to access the Kubernetes API
    - name: AdmissionFlags.DisableAdmissionPlugins
      kind: 24
      container: 23
      help: List of Kubernetes admission plugins to disable
    - name: AdmissionFlags.EnableAdmissionPlugins
      kind: 24
      container: 23
      help: List of Kubernetes admission plugins to enable
    - name: Auth.Oidc.ClientId
      kind: 24
      help: The client id that all tokens must be issued for.
    - name: Auth.Oidc.GroupsClaim
      kind: 24
      container: 23
    - name: Auth.Oidc.GroupsPrefix
      kind: 24
    - name: Auth.Oidc.IssuerUrl
      kind: 24
      help: The URL of the provider that allows the API server to discover public signing keys.
    - name: Auth.Oidc.RequiredClaim
      kind: 24
      container: 21
    - name: Auth.Oidc.UsernameClaim
      kind: 24
    - name: Auth.Oidc.UsernamePrefix
      kind: 24
    - name: AutoMaintenances.MinorUpgradeMaintenance.DurationHours
      kind: 2
      help: Duration of the maintenance window in hours
    - name: AutoMaintenances.MinorUpgradeMaintenance.Enabled
      kind: 1
      help: Flag to enable or disable the maintenance window
    - name: AutoMaintenances.MinorUpgradeMaintenance.StartHour
      kind: 2
      help: Hour of the day when maintenance window starts (0-23)
    - name: AutoMaintenances.MinorUpgradeMaintenance.Tz
      kind: 24
      help: Timezone for the maintenance window
    - name: AutoMaintenances.MinorUpgradeMaintenance.WeekDay
      kind: 24
      help: Day of the week for the maintenance window
      values:
      - Fri
      - Mon
      - Sat
      - string
      - Sun
      - Thu
      - Tue
      - Wed
    - name: AutoMaintenances.PatchUpgradeMaintenance.DurationHours
      kind: 2
      help: Duration of the maintenance window in hours
    - name: AutoMaintenances.PatchUpgradeMaintenance.Enabled
      kind: 1
      help: Flag to enable or disable the maintenance window
    - name: AutoMaintenances.PatchUpgradeMaintenance.StartHour
      kind: 2
      help: Hour of the day when maintenance window starts (0-23)
    - name: AutoMaintenances.PatchUpgradeMaintenance.Tz
      kind: 24
      help: Timezone for the maintenance window
    - name: AutoMaintenances.PatchUpgradeMaintenance.WeekDay
      kind: 24
      help: Day of the week for the maintenance window
      values:
      - Fri
      - Mon
      - Sat
      - string
      - Sun
      - Thu
      - Tue
      - Wed
    - name: CidrPods
      required: true
      kind: 24
      help: '[REQUIRED] CIDR block for Kubernetes pods network Example: 10.91.0.0/16'
    - name: CidrService
      required: true
      kind: 24
      help: '[REQUIRED] CIDR block for Kubernetes services network Example: 10.92.0.0/16'
    - name: ClusterDns
      kind: 24
      help: 'IP address for cluster DNS service Example: 10.92.0.10'
    - name: ControlPlanes
      kind: 24
      help: Size of control plane deployment for the cluster
    - name: CpMultiAz
      kind: 1
      help: Flag to enable multi-availability zone for the control plane
    - name: CpSubregions
      kind: 24
      container: 23
      help: List of subregions where control plane components are deployed
    - name: Description
      kind: 24
    - name: DisableApiTermination
      kind: 1
      help: 'Flag to prevent accidental cluster deletion Example: false'
    - name: MaintenanceWindow.DurationHours
      kind: 2
      help: Duration of the maintenance window in hours
    - name: MaintenanceWindow.StartHour
      kind: 2
      help: Hour of the day when maintenance window starts (0-23)
    - name: MaintenanceWindow.Tz
      kind: 24
      help: Timezone for the maintenance window
    - name: MaintenanceWindow.WeekDay
      kind: 24
      help: Day of the week for the maintenance window
      values:
      - Fri
      - Mon
      - Sat
      - string
      - Sun
      - Thu
      - Tue
      - Wed
    - name: Name
      required: true
      kind: 24
      help: '[REQUIRED] Unique cluster name per project, must start with a letter and contain only lowercase letters, numbers, or hyphens Example: awesome-cluster'
    - name: ProjectId
      required: true
      kind: 24
      help: '[REQUIRED] Unique identifier of the project this cluster belongs to'
    - name: Quirks
      kind: 24
      container: 23
    - name: Tags
      kind: 24
      container: 21
    - name: Version
      required: true
      kind: 24
      help: '[REQUIRED] Version of Kubernetes to be deployed'
    help: Creates a new cluster with the provided configuration. The request must include the cluster details in the request body. all clusters are associated to a project
    short: Creates a new cluster with the provided configuration.
  CreateProject:
    use: CreateProject
    content: Project
    entity: project
    group: Projects
    flags:
    - name: Cidr
      required: true
      kind: 24
      help: '[REQUIRED] CIDR block associated with the project''s VPC'
    - name: Description
      kind: 24
      help: Optional description of the project
    - name: DisableApiTermination
      kind: 1
      help: 'Flag to prevent accidental project deletion Example: false'
    - name: Name
      required: true
      kind: 24
      help: '[REQUIRED] Unique name for the project, must start with a letter and contain only lowercase letters, numbers, or hyphens Example: awesome-project'
    - name: Quirks
      kind: 24
      container: 23
    - name: Region
      required: true
      kind: 24
      help: '[REQUIRED] Region where the project is deployed'
    - name: Tags
      kind: 24
      container: 21
    help: Creates a new project with the provided details. The request must include the project data in the request body. Returns the details of the created project.
    short: Creates a new project with the provided details.
  DeleteCluster:
    use: DeleteCluster id
    entity: cluster
    group: Clusters
    help: Deletes a specific cluster by its ID. Returns confirmation of the deletion.
    short: Deletes a specific cluster by its ID.
  DeleteProject:
    use: DeleteProject id
    entity: project
    group: Projects
    help: Deletes a specific project by its ID. Returns a confirmation of the project deletion.
    short: Deletes a specific project by its ID.
  GetCPSubregions:
    use: GetCPSubregions
    entity: cpsubregion
    group: Clusters
    help: Retrieves the available subregions for cluster deployment. Returns a list of supported subregions for cluster creation.
    short: Retrieves the available subregions for cluster deployment.
  GetCluster:
    use: GetCluster id
    content: Cluster
    entity: cluster
    group: Clusters
    help: Retrieves detailed information about a specific cluster by its ID. Returns the cluster details if found.
    short: Retrieves detailed information about a specific cluster by its ID.
  GetClusterTemplate:
    use: GetClusterTemplate
    content: Template
    entity: clustertemplate
    group: Templates
    help: Retrieves the default cluster template, including predefined control plane configurations, networking settings, and maintenance schedules. Returns a JSON response containing the request context and template details, such as control plane type, CIDR ranges for pods and services, admission flags, multi-AZ support, Kubernetes version, subregions, and scheduled automatic maintenance settings.
    short: Retrieves the default cluster template, including predefined control plane configurations, networking settings, and maintenance schedules.
  GetControlPlanePlans:
    use: GetControlPlanePlans
    entity: controlplaneplan
    group: Clusters
    help: Retrieves the available control plane plans for cluster deployment. Returns a list of supported control plane plans for cluster creation or upgrades.
    short: Retrieves the available control plane plans for cluster deployment.
  GetKubeconfig:
    use: GetKubeconfig id
    content: Cluster.Data.Kubeconfig
    entity: kubeconfig
    group: Clusters
    flags:
    - name: User
      kind: 24
    - name: Group
      kind: 24
    - name: Ttl
      kind: 24
  GetKubeconfigWithPubkeyNACL:
    use: GetKubeconfigWithPubkeyNACL id
    content: Cluster
    entity: kubeconfigwithpubkeynacl
    group: Clusters
    flags:
    - name: User
      kind: 24
    - name: Group
      kind: 24
    - name: Ttl
      kind: 24
    - name: XEncryptNacl
      kind: 24
    help: Retrieves the kubeconfig for a specific cluster by its ID with optional NaCl public key encryption. Optionally, you can specify a user, group, and TTL (time-to-live) for the kubeconfig. If the x_encrypt_nacl header is provided, the kubeconfig will be encrypted using the given NaCl public key. Returns the kubeconfig details as a dictionary.
    short: Retrieves the kubeconfig for a specific cluster by its ID with optional NaCl public key encryption.
  GetKubernetesVersions:
    use: GetKubernetesVersions
    entity: kubernetesversion
    group: Clusters
    help: Retrieves the available Kubernetes versions for cluster creation or upgrades. Returns a list of supported Kubernetes versions.
    short: Retrieves the available Kubernetes versions for cluster creation or upgrades.
  GetNetPeeringAcceptanceTemplate:
    use: GetNetPeeringAcceptanceTemplate
    content: Template
    entity: netpeeringacceptancetemplate
    group: Templates
    help: NetPeering Acceptance manifest
    short: NetPeering Acceptance manifest
  GetNetPeeringRequestTemplate:
    use: GetNetPeeringRequestTemplate
    content: Template
    entity: netpeeringrequesttemplate
    group: Templates
    help: NetPeering Request manifest
    short: NetPeering Request manifest
  GetNodepoolTemplate:
    use: GetNodepoolTemplate
    content: Template
    entity: nodepooltemplate
    group: Templates
    help: Retrieves the default node pool template, including predefined configurations for node scaling, storage, and upgrade strategies. Returns a JSON response containing the request context and template details, such as node count, node type, availability zones, volume specifications, upgrade strategy, and auto-healing settings.
    short: Retrieves the default node pool template, including predefined configurations for node scaling, storage, and upgrade strategies.
  GetProject:
    use: GetProject id
    content: Project
    entity: project
    group: Projects
    help: Retrieves detailed information about a specific project by its ID. Returns the details of the project if found.
    short: Retrieves detailed information about a specific project by its ID.
  GetProjectNets:
    use: GetProjectNets id
    content: Nets
    entity: net
    group: Projects
  GetProjectPublicIps:
    use: GetProjectPublicIps id
    content: PublicIps
    entity: publicip
    group: Projects
  GetProjectQuotas:
    use: GetProjectQuotas id
    content: Project
    entity: quota
    group: Projects
  GetProjectSnapshots:
    use: GetProjectSnapshots id
    content: Snapshots
    entity: publicip
    group: Projects
  GetProjectTemplate:
    use: GetProjectTemplate
    content: Template
    entity: projecttemplate
    group: Templates
    help: Retrieves the default project template, including predefined network configurations, region, and metadata. Returns a JSON response containing the request context and template details, such as CIDR block, project name, region, description, and tags.
    short: Retrieves the default project template, including predefined network configurations, region, and metadata.
  GetQuotas:
    use: GetQuotas
    content: Quotas
    entity: quota
    group: Quotas
  ListAllClusters:
    use: ListAllClusters
    content: Clusters
    entity: cluster
    group: Clusters
    flags:
    - name: Name
      kind: 24
    - name: Status
      kind: 24
    - name: Version
      kind: 24
    - name: Deleted
      kind: 1
    - name: Cursor
      kind: 24
    - name: Page
      kind: 2
    - name: Limit
      kind: 2
  ListClustersByProjectID:
    use: ListClustersByProjectID
    content: Clusters
    entity: cluster
    group: Clusters
    flags:
    - name: ProjectId
      kind: 24
    - name: Name
      kind: 24
    - name: Status
      kind: 24
      values:
      - deleting
      - deploying
      - failed
      - pending
      - ready
      - updating
      - upgrading
    - name: Version
      kind: 24
    - name: Deleted
      kind: 1
    - name: Cursor
      kind: 24
    - name: Page
      kind: 2
    - name: Limit
      kind: 2
  ListProjects:
    use: ListProjects
    content: Projects
    entity: project
    group: Projects
    flags:
    - name: Name
      kind: 24
    - name: Status
      kind: 24
      values:
      - deleting
      - deploying
      - failed
      - pending
      - ready
      - updating
    - name: Cidr
      kind: 24
    - name: Deleted
      kind: 1
    - name: Cursor
      kind: 24
    - name: Page
      kind: 2
    - name: Limit
      kind: 2
    help: Retrieves a list of all projects with optional filters for name, status, CIDR, and deletion status. Returns a list of matching projects based on the specified filters.
    short: Retrieves a list of all projects with optional filters for name, status, CIDR, and deletion status.
  UpdateCluster:
    use: UpdateCluster id
    content: Cluster
    entity: cluster
    group: Clusters
    flags:
    - name: AdminWhitelist
      kind: 24
      container: 23
    - name: AdmissionFlags.DisableAdmissionPlugins
      kind: 24
      container: 23
      help: List of Kubernetes admission plugins to disable
    - name: AdmissionFlags.EnableAdmissionPlugins
      kind: 24
      container: 23
      help: List of Kubernetes admission plugins to enable
    - name: Auth.Oidc.ClientId
      kind: 24
      help: The client id that all tokens must be issued for.
    - name: Auth.Oidc.GroupsClaim
      kind: 24
      container: 23
    - name: Auth.Oidc.GroupsPrefix
      kind: 24
    - name: Auth.Oidc.IssuerUrl
      kind: 24
      help: The URL of the provider that allows the API server to discover public signing keys.
    - name: Auth.Oidc.RequiredClaim
      kind: 24
      container: 21
    - name: Auth.Oidc.UsernameClaim
      kind: 24
    - name: Auth.Oidc.UsernamePrefix
      kind: 24
    - name: AutoMaintenances.MinorUpgradeMaintenance.DurationHours
      kind: 2
      help: Duration of the maintenance window in hours
    - name: AutoMaintenances.MinorUpgradeMaintenance.Enabled
      kind: 1
      help: Flag to enable or disable the maintenance window
    - name: AutoMaintenances.MinorUpgradeMaintenance.StartHour
      kind: 2
      help: Hour of the day when maintenance window starts (0-23)
    - name: AutoMaintenances.MinorUpgradeMaintenance.Tz
      kind: 24
      help: Timezone for the maintenance window
    - name: AutoMaintenances.MinorUpgradeMaintenance.WeekDay
      kind: 24
      help: Day of the week for the maintenance window
      values:
      - Fri
      - Mon
      - Sat
      - string
      - Sun
      - Thu
      - Tue
      - Wed
    - name: AutoMaintenances.PatchUpgradeMaintenance.DurationHours
      kind: 2
      help: Duration of the maintenance window in hours
    - name: AutoMaintenances.PatchUpgradeMaintenance.Enabled
      kind: 1
      help: Flag to enable or disable the maintenance window
    - name: AutoMaintenances.PatchUpgradeMaintenance.StartHour
      kind: 2
      help: Hour of the day when maintenance window starts (0-23)
    - name: AutoMaintenances.PatchUpgradeMaintenance.Tz
      kind: 24
      help: Timezone for the maintenance window
    - name: AutoMaintenances.PatchUpgradeMaintenance.WeekDay
      kind: 24
      help: Day of the week for the maintenance window
      values:
      - Fri
      - Mon
      - Sat
      - string
      - Sun
      - Thu
      - Tue
      - Wed
    - name: ControlPlanes
      kind: 24
      help: Size of control plane deployment for the cluster
    - name: Description
      kind: 24
    - name: DisableApiTermination
      kind: 1
    - name: MaintenanceWindow.DurationHours
      kind: 2
      help: Duration of the maintenance window in hours
    - name: MaintenanceWindow.StartHour
      kind: 2
      help: Hour of the day when maintenance window starts (0-23)
    - name: MaintenanceWindow.Tz
      kind: 24
      help: Timezone for the maintenance window
    - name: MaintenanceWindow.WeekDay
      kind: 24
      help: Day of the week for the maintenance window
      values:
      - Fri
      - Mon
      - Sat
      - string
      - Sun
      - Thu
      - Tue
      - Wed
    - name: Quirks
      kind: 24
      container: 23
    - name: Tags
      kind: 24
      container: 21
    - name: Version
      kind: 24
    help: Updates the configuration of an existing cluster by its ID. The request must include the updated cluster details in the request body. Returns the updated cluster information
    short: Updates the configuration of an existing cluster by its ID.
  UpdateProject:
    use: UpdateProject id
    content: Project
    entity: project
    group: Projects
    flags:
    - name: Description
      kind: 24
    - name: DisableApiTermination
      kind: 1
    - name: Quirks
      kind: 24
      container: 23
    - name: Tags
      kind: 24
      container: 21
    help: Updates the details of an existing project by its ID. The request must include the updated project data in the request body. Returns the updated project information.
    short: Updates the details of an existing project by its ID.
  UpgradeCluster:
    use: UpgradeCluster id
    content: Cluster
    entity: cluster
    group: Clusters
    help: Upgrades a specific cluster by its ID to the latest available version. Returns the updated cluster details after the upgrade process is completed.
    short: Upgrades a specific cluster by its ID to the latest available version.
entities:
  cluster:
    title: Cluster
    columns:
    - title: ID
      content: .id
    - title: Name
      content: .name
    - title: Version
      content: .version
    - title: Control Plane
      content: .control_planes
    - title: Status
      content: .statuses.status
    primary: Id
  clustertemplate:
    title: ClusterTemplate
    columns:
    - title: Name
      content: .Tags[] | select(.Key == "Name").Value
  controlplaneplan:
    title: ControlPlanePlan
  cpsubregion:
    title: CPSubregion
  kubeconfig:
    title: Kubeconfig
  kubeconfigwithpubkeynacl:
    title: KubeconfigWithPubkeyNACL
  kubernetesversion:
    title: KubernetesVersion
  net:
    title: ProjectNet
  netpeeringacceptancetemplate:
    title: NetPeeringAcceptanceTemplate
  netpeeringrequesttemplate:
    title: NetPeeringRequestTemplate
  nodepooltemplate:
    title: NodepoolTemplate
  project:
    title: Project
    columns:
    - title: ID
      content: .id
    - title: Name
      content: .name
    - title: Status
      content: .status
    primary: Id
  projecttemplate:
    title: ProjectTemplate
    columns:
    - title: Name
      content: .Name
    primary: Name
  publicip:
    title: ProjectPublicIpsIPS
    columns:
    - title: Name
      content: .Tags[] | select(.Key == "Name").Value
  quota:
    title: ProjectQuota
